<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LumiDNA — Admin</title>
<style>
:root{--ink:#2c2c2a;--muted:#5f5e5a;--line:#d3d1c7;--soft:#f6f5f1;--orange:#ff7a2f;--green:#639922;--greent:#3b6d11;--red:#e24b4a;--redt:#a32d2d}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;background:#fff;color:var(--ink)}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
header b{font-size:20px}header b span{color:var(--orange)}
.small{font-size:13px;color:var(--muted)}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;background:#fff;border:1px solid #b4b2a9;border-radius:8px;padding:8px 14px}
button:hover{background:var(--soft)}
button.p{background:var(--orange);border-color:var(--orange);color:#1a0d04;font-weight:600}
button.p:hover{filter:brightness(1.06);background:var(--orange)}
button.danger{color:var(--redt);border-color:#f09595}
input,select,textarea{width:100%;background:#fff;border:1px solid #b4b2a9;border-radius:8px;padding:8px 10px}
input[type=checkbox]{width:auto}
td input[type=number]{width:72px;min-width:72px;padding:8px 4px;text-align:center}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:#fff}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar .grow{flex:1;min-width:180px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:14px 44px minmax(0,1.6fr) minmax(0,1fr) 90px minmax(0,1.2fr);gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}.row:hover{background:var(--soft)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.g{background:var(--green)}.r{background:var(--red)}
.kfoto{display:grid;gap:2px;width:44px;height:44px;border-radius:6px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.kfoto.n1{grid-template-columns:1fr}.kfoto.n2{grid-template-columns:1fr 1fr}.kfoto.n3,.kfoto.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.kfoto img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.ovc{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.ovc img.big{width:100%;max-height:260px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
.kfotoG{display:flex;flex-wrap:wrap;gap:10px}
.kfotoG figure{margin:0;text-align:center;width:110px}
.kfotoG img{width:110px;height:110px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;display:block}
.kfotoG figcaption{font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.thumb{width:40px;height:40px;border-radius:6px;background:var(--soft);object-fit:contain;border:1px solid var(--line)}
.ok{color:var(--greent);font-size:12px}.no{color:var(--redt);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{margin-bottom:12px}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:14px}
.msg.e{background:#fcebeb;color:var(--redt)}.msg.s{background:#eaf3de;color:var(--greent)}
.pills span{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:2px;font-size:12px}
.box{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px}
.box label{font-weight:400;color:var(--ink);font-size:14px;margin:0;padding:3px 4px;display:flex;gap:8px;align-items:center;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.grp{padding:14px}.prow{border-top:1px solid var(--line);padding:10px 0}.prow:first-child{border-top:0}
.etqs{display:flex;flex-wrap:wrap;gap:8px}
.etq{display:flex;gap:2mm;align-items:center;border:1px dashed #b4b2a9;padding:2mm;overflow:hidden;font-size:9pt;line-height:1.25;background:#fff;break-inside:avoid}
.etq .qr svg{width:100%;height:100%;display:block}.etq .qr{flex:none}.etq .et{min-width:0;overflow-wrap:anywhere}.etq .et b{font-size:11pt}
.homebg{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#ff7a2f 0%,#e8641c 45%,#b8420a 100%)}
body:has(.homebg) header b,body:has(.homebg) header .small,body:has(.homebg) header a{color:#fff}
body:has(.homebg) header b span{color:#2c2c2a}
.homewrap{display:flex;flex-direction:column;height:calc(100vh - 100px);height:calc(100dvh - 100px);min-height:400px}
.homeh{margin:0;font-size:20px;font-weight:700;color:#fff}
.homesub{font-size:13px;color:#fff;opacity:.92;margin:0 0 10px}
.home{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(6,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;padding:6px 16px;min-height:0;border:0;border-left:6px solid var(--orange);border-radius:12px;background:rgba(255,255,255,.94);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.10)}
.tile:hover{background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.16)}
.tile b{font-size:18px;display:flex;align-items:center;gap:6px;line-height:1.2}
.tile span.d{font-size:12.5px;color:var(--muted);font-weight:400;line-height:1.3}
@media(min-width:700px){.home{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr))}.homewrap{height:calc(100vh - 120px);height:calc(100dvh - 120px)}}
@media print{.noprint,header,#msg{display:none!important}.wrap{max-width:none;padding:0}.etq{border:0;outline:0.1mm dashed #bbb}.etqs{gap:0}}
@media(max-width:640px){.row{grid-template-columns:14px 40px minmax(0,1fr) 80px}.row .c4,.row .c6{display:none}}
.orow{grid-template-columns:14px minmax(0,1.5fr) minmax(0,1fr) minmax(96px,auto) minmax(0,1.2fr)}
.orow .np{white-space:nowrap}
.clista{border:1px solid var(--line);border-radius:10px;overflow:hidden}.crow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}.crow:first-child{border-top:0}.crow .cimg{width:52px;height:52px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;flex:none}.crow .cimg.v{background:var(--soft)}.crow .cinfo{flex:1;min-width:0}
#f_codigo,#f_fabricante,#nk_codigo,#nk_fabricante,#p_local,#a_loc,#a_lum,#k_nome,[data-loc]{text-transform:uppercase}
.gcard{display:flex;gap:12px;align-items:flex-start}.gcard .gimg{width:60px;height:60px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;flex:none}.gcard .gimg.v{background:var(--soft)}
.iitem{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.ihead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.iqtd{flex:none;text-align:center;background:var(--soft);border-radius:8px;padding:4px 14px}.iqtd b{display:block;font-size:20px;line-height:1.2}
.ibtns{display:flex;gap:12px;flex-wrap:wrap}
.ibtns button{flex:1;min-width:84px;min-height:46px;padding:10px 10px;font-size:15px}
.iedit input{max-width:160px;margin-bottom:10px}
.tscroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
@media(max-width:640px){.tscroll table{font-size:12px}.tscroll th,.tscroll td{padding:6px 4px}}
.pdrow{grid-template-columns:14px minmax(0,1.3fr) minmax(0,1.2fr) minmax(96px,auto) minmax(110px,auto)}
.pdrow .np{white-space:nowrap}
.pnrow{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(110px,auto)}
@media(max-width:640px){.pdrow{grid-template-columns:14px minmax(0,1fr) auto;row-gap:4px}.pdrow>:nth-child(2){grid-column:2/4}.pdrow>:nth-child(3){grid-column:2}.pdrow>:nth-child(4){grid-column:3;text-align:right}.pdrow>:nth-child(5){grid-column:2/4}
.pnrow{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}.pnrow>:nth-child(1){grid-column:1}.pnrow>:nth-child(3){grid-column:2;text-align:right}.pnrow>:nth-child(2){grid-column:1/3}}
@media(max-width:640px){.orow{grid-template-columns:14px minmax(0,1fr) auto;row-gap:4px}.orow>:nth-child(2){grid-column:2/4}.orow>:nth-child(3){grid-column:2}.orow>:nth-child(4){grid-column:3;text-align:right}.orow>:nth-child(5){grid-column:2/4}}
</style>
</head>
<body>
<div class="wrap">
<header class="noprint"><b data-act="home" style="cursor:pointer" title="Página inicial">Lumi<span>DNA</span> · Admin</b><div id="quem" class="small"></div></header>
<div id="msg"></div>
<div id="app"><div class="small">Carregando…</div></div>
</div>
<script src="../assets/supabase-config.js"></script>
<script src="../assets/notificar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
let sb=supabase.createClient(LUMIDNA_SUPABASE_URL,LUMIDNA_SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>(s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").replace(/\s+/g," ").trim().toLowerCase();
const nv=v=>(v===""||v==null)?null:v;
const num=v=>{ if(v==null||String(v).trim()==="") return null; const n=Number(String(v).replace(",",".")); return isNaN(n)?null:n; };
const brl=v=>v==null?"—":"R$ "+Number(v).toFixed(2).replace(".",",");
const fmt=v=>v==null?"—":String(Number(v)).replace(".",",");

const TIPOS={luminaria:"Luminárias",led:"LEDs",driver:"Drivers",optica:"Ópticas"};
const TIPO1={luminaria:"Luminária",led:"LED",driver:"Driver",optica:"Óptica"};
const S={view:"lista",tab:"luminaria",busca:"",vermelhos:false,produtos:[],compat:[],kits:[],itens:[],cur:null,compSel:new Set(),kit:null};

function msg(t,ok=true){ $("#msg").innerHTML=t?`<div class="msg ${ok?"s":"e"}">${esc(t)}</div>`:""; if(t) window.scrollTo({top:0,behavior:"smooth"}); }

// ---- regra do verde/vermelho ----
function faltas(p){
  const f=[];
  if(!p.codigo) f.push("código");
  if(!p.fabricante) f.push("fabricante");
  if(p.preco==null) f.push("preço");
  if(!p.foto_url&&!fotoAuto(p).length) f.push("foto");
  if(p.tipo==="led"){ if(p.potencia_w==null) f.push("potência"); if(!p.cct_k) f.push("temp. de cor"); }
  if(p.tipo==="driver"){ if(p.corrente_ma==null) f.push("corrente"); }
  if(p.tipo==="optica"){ if(p.facho_graus==null) f.push("facho"); }
  if(p.tipo==="luminaria"&&p.integrada&&p.potencia_w==null&&!(p.detalhes&&p.detalhes.sem_potencia)) f.push("potência");
  return f;
}
function specLinha(p){
  if(p.tipo==="luminaria") return p.integrada?`Lâmpada integrada${p.potencia_w!=null?" · "+fmt(p.potencia_w)+" W":""}`:(p.descricao||"");
  if(p.tipo==="led") return [p.potencia_w!=null?fmt(p.potencia_w)+" W":"",p.cct_k?p.cct_k+" K":""].filter(Boolean).join(" · ");
  if(p.tipo==="driver"){ if(p.corrente_ma==null) return ""; const mn=(p.detalhes||{}).corrente_min_ma; return (mn?fmt(mn)+"–":"")+fmt(p.corrente_ma)+" mA"; }
  return p.facho_graus!=null?fmt(p.facho_graus)+"°":"";
}
const porId=id=>S.produtos.find(p=>p.id===id);

// luminária sem foto própria: usa as fotos dos itens dos kits dela
function fotoAuto(p){
  if(p.tipo!=="luminaria"||p.foto_url) return [];
  const its=[]; S.kits.filter(k=>k.luminaria_id===p.id).forEach(k=>S.itens.filter(i=>i.kit_id===k.id).forEach(i=>its.push({p:porId(i.produto_id)})));
  return fotosDoKit(its);
}
function miniFotos(fs){ const f=fs.slice(0,4); return f.length?'<div class="kfoto n'+f.length+'">'+f.map(p=>'<img src="'+esc(p.foto_url)+'" alt="'+esc(p.codigo)+'">').join("")+'</div>':'<div class="thumb"></div>'; }
// foto do kit = fotos dos itens juntas (cada uma mantém a proporção, sem esticar)
function fotosDoKit(its){ const vistos=new Set(), out=[]; its.forEach(i=>{ if(i.p&&i.p.foto_url&&!vistos.has(i.p.id)){ vistos.add(i.p.id); out.push(i.p); } }); return out; }
function kitFotoMini(its){ const f=fotosDoKit(its).slice(0,4); return f.length?`<div class="kfoto n${f.length}">${f.map(p=>`<img src="${esc(p.foto_url)}" alt="${esc(p.codigo)}">`).join("")}</div>`:`<div class="thumb"></div>`; }
// ---- kits ----
function kitInfo(k){
  const its=S.itens.filter(i=>i.kit_id===k.id).map(i=>({...i,p:porId(i.produto_id)})).filter(i=>i.p);
  const faltaItem=its.filter(i=>faltas(i.p).length);
  const leds=its.filter(i=>i.p.tipo==="led");
  const semPot=leds.filter(i=>i.p.potencia_w==null);
  const total=leds.reduce((s,i)=>s+(i.p.potencia_w||0)*i.quantidade,0);
  const f=[];
  if(!k.luminaria_id) f.push("luminária");
  if(!its.length) f.push("itens");
  if(faltaItem.length) f.push("itens incompletos");
  return {its,total,semPot:semPot.length,faltas:f,leds:leds.length};
}

// ---- carregar tudo ----
async function pagina(consulta){
  const out=[]; for(let i=0;;i+=1000){ const r=await consulta().range(i,i+999); if(r.error) throw r.error; out.push(...(r.data||[])); if(!r.data||r.data.length<1000) break; }
  return out;
}
async function carregar(){
  try{
    [S.produtos,S.compat,S.kits,S.itens,S.similares]=await Promise.all([
      pagina(()=>sb.from("v2_produtos").select("*").order("id")),
      pagina(()=>sb.from("v2_compatibilidade").select("*").order("componente_id")),
      pagina(()=>sb.from("v2_kits").select("*").order("id")),
      pagina(()=>sb.from("v2_kit_itens").select("*").order("kit_id")),
      pagina(()=>sb.from("v2_similares").select("*").order("original_id"))
    ]);
  }catch(e){ $("#app").innerHTML=`<div class="msg e">Não consegui carregar o catálogo: ${esc(e.message||e)}<br>Se for "relation does not exist", falta rodar o SQL v2_01_catalogo no Supabase.</div>`; return false; }
  return true;
}

// ---- login ----
function telaLogin(m){
  $("#quem").textContent="";
  $("#app").innerHTML=`<div class="card" style="max-width:360px;margin:40px auto">
    <h3 style="margin-top:0">Entrar</h3>${m?`<div class="msg e">${esc(m)}</div>`:""}
    <div class="field"><label>E-mail</label><input id="lg_email" type="email"></div>
    <div class="field"><label>Senha</label><input id="lg_senha" type="password"></div>
    <button class="p" style="width:100%" data-act="entrar">Entrar</button></div>`;
}
async function entrar(){
  const r=await sb.auth.signInWithPassword({email:$("#lg_email").value.trim(),password:$("#lg_senha").value});
  if(r.error) return telaLogin("E-mail ou senha incorretos.");
  iniciar();
}

// ---- lista ----
function renderLista(){
  S.view="lista";
  $("#app").innerHTML=navArea("cat")+`
    <div class="bar"><div class="tabs" style="margin:0">${Object.entries(TIPOS).map(([t,n])=>`<button class="tab ${S.tab===t?"on":""}" data-act="aba" data-t="${t}">${n}</button>`).join("")}<button class="tab ${S.tab==="kit"?"on":""}" data-act="aba" data-t="kit">Kits</button></div>
      <div style="margin-left:auto;display:flex;gap:8px"><button data-act="importar">Importar lista</button><button class="p" data-act="novo">+ Novo ${S.tab==="kit"?"kit":"item"}</button></div></div>
    <div class="bar"><input class="grow" id="busca" placeholder="Buscar por código ou fabricante" value="${esc(S.busca)}">
      <label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:400"><input type="checkbox" id="verm" ${S.vermelhos?"checked":""}> Só os vermelhos</label></div>
    <div id="lista"></div>`;
  $("#busca").oninput=e=>{S.busca=e.target.value;atualizarLista()};
  $("#verm").onchange=e=>{S.vermelhos=e.target.checked;atualizarLista()};
  atualizarLista();
}
function atualizarLista(){
  const t=norm(S.busca);
  let html="";
  if(S.tab==="kit"){
    let ks=S.kits.filter(k=>!t||norm(k.nome).includes(t));
    const info=k=>kitInfo(k);
    if(S.vermelhos) ks=ks.filter(k=>info(k).faltas.length);
    html=ks.length?`<div class="list">${ks.map(k=>{
      const i=info(k), lum=porId(k.luminaria_id);
      return `<div class="row" data-act="abrirKit" data-id="${k.id}"><span class="dot ${i.faltas.length?"r":"g"}"></span>${kitFotoMini(i.its)}
        <div style="min-width:0"><b>${esc(k.nome)}</b><div class="small">${lum?"serve em "+esc(lum.codigo):"sem luminária"}</div></div>
        <div class="small c4">${i.its.map(x=>x.quantidade+"x "+esc(x.p.codigo)).join(" · ")||"sem itens"}</div>
        <div><b>${i.leds?fmt(Math.round(i.total*100)/100)+" W":"—"}</b></div>
        <div class="${i.faltas.length?"no":"ok"} c6">${i.faltas.length?"Falta: "+i.faltas.join(", "):"Completo"}</div></div>`}).join("")}</div>`:`<div class="small">Nenhum kit encontrado.</div>`;
  }else{
    let ps=S.produtos.filter(p=>p.tipo===S.tab&&(!t||norm(p.codigo).includes(t)||norm(p.fabricante).includes(t)));
    if(S.vermelhos) ps=ps.filter(p=>faltas(p).length);
    ps.sort((a,b)=>String(a.codigo).localeCompare(String(b.codigo),"pt-BR",{numeric:true}));
    const mostrar=ps.slice(0,200);
    html=ps.length?`<div class="list">${mostrar.map(p=>{
      const f=faltas(p);
      return `<div class="row" data-act="abrir" data-id="${p.id}"><span class="dot ${f.length?"r":"g"}"></span>
        ${p.foto_url?`<img class="thumb" data-act="info" data-id="${p.id}" style="cursor:zoom-in" src="${esc(p.foto_url)}" alt="">`:miniFotos(fotoAuto(p))}
        <div style="min-width:0"><b>${esc(p.codigo)}</b><div class="small">${esc(p.fabricante)||"sem fabricante"}</div></div>
        <div class="small c4">${esc(specLinha(p))}</div><div><b>${p.preco!=null?brl(p.preco):"<span class='no'>sem preço</span>"}</b></div>
        <div class="${f.length?"no":"ok"} c6">${f.length?"Falta: "+f.join(", "):(!p.foto_url&&fotoAuto(p).length?"Completo · foto montada do kit":"Completo")}</div></div>`}).join("")}</div>${ps.length>200?`<div class="small" style="margin-top:8px">Mostrando 200 de ${ps.length}. Use a busca pra achar o resto.</div>`:""}`:`<div class="small">Nada encontrado${S.tab!=="kit"?`. Use "+ Novo item" ou "Importar lista".`:"."}</div>`;
    const tot=S.produtos.filter(p=>p.tipo===S.tab), verm=tot.filter(p=>faltas(p).length).length;
    html=`<div class="small" style="margin-bottom:8px">${tot.length} item(ns) · <span class="ok">${tot.length-verm} completo(s)</span> · <span class="no">${verm} com falta</span></div>`+html;
  }
  $("#lista").innerHTML=html;
}

// ---- item (editor) ----
function novoItem(){
  S.cur={id:null,tipo:S.tab==="kit"?"led":S.tab,fabricante:"",codigo:"",descricao:"",preco:null,foto_url:null,potencia_w:null,cct_k:null,corrente_ma:null,facho_graus:null,integrada:false,detalhes:{}};
  S.compSel=new Set(); renderItem();
}
function abrirItem(id){
  S.cur=JSON.parse(JSON.stringify(porId(id)));
  const _p=porId(id);
  S.compSel=_p&&_p.tipo==="luminaria"?new Set(S.compat.filter(c=>c.luminaria_id===id).map(c=>c.componente_id)):new Set(S.compat.filter(c=>c.componente_id===id).map(c=>c.luminaria_id));
  S.clTipo="led"; S.clBusca="";
  renderItem();
}

// ---- proteção contra cadastro duplicado ----
// regra 1: o código é a chave; maiúsculas, espaços, traços, pontos e barras não contam como diferença
const chaveCod=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const FAMILIA=/^\d{4}\.[a-z]{2}\.[a-z]$/i;
function distCod(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>3) return 9; let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
// regra 2: códigos parecidos (uma letra de diferença, ou um contido no outro)
function codigosParecidos(codigo,exceptId,lista){
  const k=chaveCod(codigo); if(k.length<4) return [];
  return (lista||S.produtos).filter(x=>{
    if(x.id===exceptId) return false;
    const o=chaveCod(x.codigo); if(o===k||o.length<4) return false;
    if(FAMILIA.test(String(codigo).trim())&&FAMILIA.test(String(x.codigo).trim())) return false; // variações de acabamento da mesma família
    const d=distCod(k,o), menor=k.length<o.length?k:o, maior=menor===k?o:k;
    if(menor.length>=4&&maior.startsWith(menor)) return true; // um é o começo do outro (ex.: CERTALINE / CERTALINE1115)
    if(k.length<5||o.length<5) return false;
    if(d<=1){ if(k.length!==o.length) return true; for(let i=0;i<k.length;i++) if(k[i]!==o[i]&&/[a-z]/.test(k[i]+o[i])) return true; return false; }
    return menor.length>=6&&maior.includes(menor);
  });
}
const nomeItem=x=>TIPO1[x.tipo]+" "+x.codigo+(x.fabricante?" ("+x.fabricante+")":"");
// regra 3: já existe → mostra o que mudaria e mantém o cadastro existente
function diferencas(ex,novo){
  const d=[];
  if(novo.preco!=null&&Number(novo.preco)!==Number(ex.preco)) d.push("preço digitado "+fmtR(novo.preco)+" (cadastrado: "+(ex.preco==null?"vazio":fmtR(ex.preco))+")");
  if(novo.descricao&&norm(novo.descricao)!==norm(ex.descricao)) d.push("descrição diferente");
  if(novo.fabricante&&norm(novo.fabricante)!==norm(ex.fabricante)) d.push("fabricante digitado "+novo.fabricante+" (cadastrado: "+(ex.fabricante||"vazio")+")");
  return d;
}
const fmtR=v=>"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
// devolve true se pode seguir; senão já mostra a mensagem
function conferirDuplicado(t,codigo,exceptId,novo){
  const k=chaveCod(codigo);
  const igual=S.produtos.find(x=>x.id!==exceptId&&x.tipo===t&&chaveCod(x.codigo)===k);
  if(igual){
    const d=diferencas(igual,novo||{});
    msg('Já existe '+nomeItem(igual)+'. Nada foi cadastrado de novo: o cadastro que já existe foi mantido.'+(d.length?' Diferenças que você digitou: '+d.join("; ")+'. Se quiser mudar, edite o item existente.':' Procure na lista e edite o existente.'),false);
    return false;
  }
  const outroTipo=S.produtos.filter(x=>x.id!==exceptId&&x.tipo!==t&&chaveCod(x.codigo)===k);
  if(outroTipo.length&&!confirm('Esse código já existe como '+outroTipo.map(nomeItem).join(", ")+'.\n\nÉ um produto diferente de outro tipo?\nOK = cadastrar mesmo assim · Cancelar = voltar')) return false;
  const par=codigosParecidos(codigo,exceptId);
  if(par.length&&!confirm('"'+codigo+'" é muito parecido com:\n\n'+par.slice(0,6).map(nomeItem).join("\n")+'\n\nPode ser o mesmo produto escrito diferente.\nOK = é outro item, cadastrar · Cancelar = voltar e conferir')) return false;
  return true;
}
// regra 4: foto repetida (comparada pelo conteúdo da imagem)
async function hashFoto(file){ const b=await file.arrayBuffer(); const d=await crypto.subtle.digest("SHA-256",b); return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function conferirFoto(file,exceptId){
  try{
    const hh=await hashFoto(file);
    const mesma=S.produtos.filter(x=>x.id!==exceptId&&x.detalhes&&x.detalhes.foto_hash===hh);
    if(mesma.length&&!confirm('Essa foto já está em:\n\n'+mesma.slice(0,6).map(nomeItem).join("\n")+'\n\nOK = usar mesmo assim · Cancelar = voltar')) return {ok:false};
    return {ok:true,hash:hh};
  }catch(e){ return {ok:true,hash:null}; }
}

async function salvarItem(){
  const p=S.cur, t=p.tipo, g=id=>{const e=$("#"+id);return e?e.value:""};
  const codigo=g("f_codigo").trim();
  if(!codigo) return msg("Informe o código do item.",false);
  if(!p.id||chaveCod(codigo)!==chaveCod(p.codigo)){
    if(!conferirDuplicado(t,codigo,p.id,{preco:num(g("f_preco")),descricao:g("f_descricao").trim(),fabricante:g("f_fabricante").trim()})) return;
  } else if(S.produtos.some(x=>x.id!==p.id&&x.tipo===t&&chaveCod(x.codigo)===chaveCod(codigo))) return msg("Já existe outro item com esse código. Procure na lista.",false);
  const detalhes={...(p.detalhes||{})}; document.querySelectorAll("[data-det]").forEach(i=>{ const v=i.value.trim(); if(v) detalhes[i.dataset.det]=v; else delete detalhes[i.dataset.det]; });
  { const dm=g("f_dimmer"); if(dm) detalhes.dimmer=dm; else delete detalhes.dimmer; const tp=[...document.querySelectorAll("[data-dim]")].filter(i=>i.checked).map(i=>i.dataset.dim); if(dm==="sim"&&tp.length) detalhes.dimmer_tipo=tp.join(", "); else delete detalhes.dimmer_tipo; }
  if(t==="driver"){ const mn=num(g("f_corrente_min")); if(mn!=null) detalhes.corrente_min_ma=mn; else delete detalhes.corrente_min_ma; }
  const integ=t==="luminaria"&&$("#f_integrada")&&$("#f_integrada").checked;
  const row={tipo:t,codigo,fabricante:nv(g("f_fabricante").trim()),descricao:nv(g("f_descricao").trim()),preco:num(g("f_preco")),
    potencia_w:(t==="led"||integ)?num(g("f_potencia")):(t==="driver"?(p.potencia_w??null):null),
    cct_k:(t==="led"||integ)?(num(g("f_cct"))==null?null:Math.round(num(g("f_cct")))):null,
    corrente_ma:t==="driver"?num(g("f_corrente")):null, facho_graus:t==="optica"?num(g("f_facho")):null,
    integrada:integ, detalhes, foto_url:p.foto_url};
  const file=$("#f_foto").files[0];
  if(file){
    if(!file.type.startsWith("image/")) return msg("O arquivo da foto precisa ser uma imagem.",false);
    const cf=await conferirFoto(file,p.id); if(!cf.ok) return;
    if(cf.hash) row.detalhes={...row.detalhes,foto_hash:cf.hash};
    const path="v2/"+`${t}_${codigo}_${Date.now()}_${file.name}`.replace(/[^\w.-]+/g,"_");
    const up=await sb.storage.from("fotos").upload(path,file,{upsert:true});
    if(up.error) return msg("Erro ao enviar a foto: "+up.error.message,false);
    row.foto_url=sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;
  }
  const r=p.id?await sb.from("v2_produtos").update(row).eq("id",p.id).select().single():await sb.from("v2_produtos").insert(row).select().single();
  if(r.error) return msg(r.error.code==="23505"?"Esse código já existe no catálogo.":"Erro ao salvar: "+r.error.message,false);
  if(t!=="luminaria"){
    const id=r.data.id, antes=new Set(S.compat.filter(c=>c.componente_id===id).map(c=>c.luminaria_id));
    const tirar=[...antes].filter(x=>!S.compSel.has(x)), por=[...S.compSel].filter(x=>!antes.has(x));
    if(tirar.length){ const d=await sb.from("v2_compatibilidade").delete().eq("componente_id",id).in("luminaria_id",tirar); if(d.error) return msg("Salvou o item, mas não consegui atualizar as luminárias: "+d.error.message,false); }
    if(por.length){ const i=await sb.from("v2_compatibilidade").insert(por.map(l=>({componente_id:id,luminaria_id:l}))); if(i.error) return msg("Salvou o item, mas não consegui ligar às luminárias: "+i.error.message,false); }
  }
  if(t==="luminaria"&&p.id&&!integ){
    const id=r.data.id, antes=new Set(S.compat.filter(c=>c.luminaria_id===id).map(c=>c.componente_id));
    const tirar=[...antes].filter(x=>!S.compSel.has(x)), por=[...S.compSel].filter(x=>!antes.has(x));
    if(tirar.length){ const d=await sb.from("v2_compatibilidade").delete().eq("luminaria_id",id).in("componente_id",tirar); if(d.error) return msg("Salvou a luminária, mas não consegui atualizar os componentes: "+d.error.message,false); }
    if(por.length){ const i=await sb.from("v2_compatibilidade").insert(por.map(c=>({componente_id:c,luminaria_id:id}))); if(i.error) return msg("Salvou a luminária, mas não consegui ligar os componentes: "+i.error.message,false); }
  }
  await carregar(); S.tab=t; renderLista(); msg(`${TIPO1[t]} "${codigo}" salvo.`);
}

const IMP_TIPOS={luminaria:"luminaria","luminária":"luminaria",led:"led",driver:"driver",optica:"optica","óptica":"optica"};
const chaveImp=(tipo,cod)=>tipo+"|"+String(cod||"").replace(/\s*\(.*\)\s*$/,"").toLowerCase().replace(/[^a-z0-9]/g,"");
function lerCSV(texto){
  const linhas=texto.trim().split(/\r?\n/).filter(l=>l.trim());
  if(linhas.length<2) return [];
  const sep=linhas[0].includes("\t")?"\t":(linhas[0].split(";").length>=linhas[0].split(",").length?";":",");
  const cab=linhas[0].split(sep).map(h=>h.trim().toLowerCase());
  return linhas.slice(1).map(l=>{ const c=l.split(sep), o={}; cab.forEach((h,i)=>o[h]=(c[i]??"").trim()); return o; });
}
function classificar(rows,existentes){
  const mapa=new Map(); existentes.forEach(e=>{const k=chaveImp(e.tipo,e.codigo); if(!mapa.has(k)) mapa.set(k,e);});
  const vistas=new Map();
  return rows.map((r,i)=>{
    const tipo=IMP_TIPOS[String(r.tipo||"").trim().toLowerCase()], codigo=String(r.codigo||"").trim();
    const l={n:i+2,tipo,codigo,fabricante:nv(r.fabricante),descricao:nv(r.descricao),preco:num(r.preco),potencia_w:num(r.potencia_w),corrente_ma:num(r.corrente_ma),cct_k:num(r.cct_k),facho_graus:num(r.facho_graus)};
    if(!tipo) return {...l,status:"erro",motivo:"tipo precisa ser luminaria, led, driver ou optica"};
    if(!codigo) return {...l,status:"erro",motivo:"código vazio"};
    const k=chaveImp(tipo,codigo);
    if(mapa.has(k)){ const e=mapa.get(k); return {...l,status:"existe",motivo:`já cadastrado${e.fabricante?" ("+e.fabricante+")":""}`}; }
    if(vistas.has(k)) return {...l,status:"repetida",motivo:`repetida na lista (linha ${vistas.get(k)})`};
    const par=codigosParecidos(codigo,null,existentes), outro=existentes.filter(e=>e.tipo!==tipo&&chaveCod(e.codigo)===chaveCod(codigo));
    if(par.length||outro.length){ vistas.set(k,l.n); return {...l,status:"duvida",motivo:"parecido com "+par.concat(outro).slice(0,3).map(nomeItem).join("; ")+" — não será cadastrado; se for outro item, use + Novo item"}; }
    vistas.set(k,l.n); return {...l,status:"novo",motivo:"será cadastrado"};
  });
}
let IMP=[];
function renderImport(){
  S.view="import";
  $("#app").innerHTML=`<button data-act="voltar" style="margin-bottom:12px">‹ Voltar</button>
    <div class="card"><h3 style="margin-top:0">Importar lista</h3>

      <textarea id="i_txt" style="min-height:150px" placeholder="tipo;fabricante;codigo;descricao;preco;potencia_w;corrente_ma;cct_k;facho_graus&#10;driver;LUCCHI;LF/FMR080YSII550HDS;Driver 200-550mA;106,20;;;;"></textarea>
      <div class="bar" style="margin-top:10px"><button class="p" data-act="conferir">Conferir</button><button id="i_ok" style="display:none" data-act="cadastrarImport">Cadastrar só os novos</button></div>
      <div id="i_res" style="margin-top:12px"></div></div>`;

function conferirImport(){
  const rows=lerCSV($("#i_txt").value);
  if(!rows.length) return msg("Cole a lista, com o cabeçalho na primeira linha.",false);
  IMP=classificar(rows,S.produtos);

async function cadastrarImport(){

  const r=await sb.from("v2_produtos").insert(novos.map(l=>({tipo:l.tipo,codigo:l.codigo,fabricante:l.fabricante,descricao:l.descricao,preco:l.preco,potencia_w:l.potencia_w,corrente_ma:l.corrente_ma,cct_k:l.cct_k==null?null:Math.round(l.cct_k),facho_graus:l.facho_graus})));

  await carregar(); const n=novos.length; renderImport(); msg(`${n} item(ns) novo(s) cadastrado(s). O que já existia não foi mexido.`);
}

async function salvarNovoNoKit(){
  const t=$("#nk_tipo").value, g=function(id){const e=$("#"+id);return e?e.value:""};
  const codigo=g("nk_codigo").trim();

  const detalhes={}; const cmin=num(g("nk_cmin")); if(t==="driver"&&cmin!=null) detalhes.corrente_min_ma=cmin;
  const cct=num(g("nk_cct"));
  const row={tipo:t,codigo:codigo,fabricante:nv(g("nk_fabricante").trim()),preco:num(g("nk_preco")),potencia_w:t==="led"?num(g("nk_potencia")):null,
    cct_k:t==="led"&&cct!=null?Math.round(cct):null,corrente_ma:t==="driver"?num(g("nk_cmax")):null,facho_graus:t==="optica"?num(g("nk_facho")):null,integrada:false,detalhes:detalhes};

    row.foto_url=sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;

  if(r.error) return msg(r.error.code==="23505"?"Esse código já existe no catálogo.":"Erro ao cadastrar: "+r.error.message,false);

}

async function kitGrupo(d){
  const lid=Number(d.id), sel=document.querySelector('select[data-act="kitGrupo"][data-id="'+lid+'"]');

  if(!alvo.length){ S.verGrupo.add(lid); renderObra(); return msg("Todas as peças desse modelo já estão com esse kit.",true); }
  let ok=0; const falhas=[];

  S.verGrupo.add(lid); await carregarObras(); renderObra();

function classificarLinhas(linhas){
  const lums=S.produtos.filter(p=>p.tipo==="luminaria");
  return linhas.map((l,i)=>{
    const c=l.split(/[;\t]/).map(x=>x.trim()), cod=c[0]||"", qtd=(c[1]===undefined||c[1]==="")?1:parseInt(c[1]), local=c[2]||"";
    let achou=lums.filter(p=>norm(p.codigo)===norm(cod));
    if(!achou.length) achou=lums.filter(p=>chaveCod(p.codigo)===chaveCod(cod)&&chaveCod(cod));
    const r={n:i+1,cod:cod,qtd:qtd,local:local};
    if(!cod) return Object.assign(r,{status:"erro",motivo:"código vazio"});
    if(!achou.length) return Object.assign(r,{status:"erro",motivo:"luminária não encontrada no catálogo"});
    if(achou.length>1) return Object.assign(r,{status:"erro",motivo:"mais de uma luminária com esse código"});
    if(isNaN(qtd)||qtd<1||qtd>200) return Object.assign(r,{status:"erro",motivo:"quantidade precisa ser de 1 a 200"});
    const lum=achou[0], kits=lum.integrada?[]:S.kits.filter(k=>k.luminaria_id===lum.id);
    return Object.assign(r,{status:"ok",lum:lum,kit:kits.length===1?kits[0]:null,kits:kits.length,motivo:lum.integrada?"lâmpada integrada (sem kit)":(kits.length===1?"kit "+kits[0].nome+" já escolhido":(kits.length?"escolha o kit depois (há "+kits.length+")":"sem kit cadastrado"))});
  });
}

async function marcarEtapaAdmin(ids,campoEm,campoPor,desfazer){
  const ss=await sb.auth.getSession(), por=ss.data.session?ss.data.session.user.email:"admin", agora=new Date().toISOString();
  const alvo=ids.filter(id=>{ const p=S.pecas.find(x=>x.id===id); return p&&(desfazer?p[campoEm]:!p[campoEm]); });
  if(!alvo.length) return true;
  const row={}; row[campoEm]=desfazer?null:agora; row[campoPor]=desfazer?null:por;
  const r=await sb.from("v2_pecas").update(row).in("id",alvo);

  return true;
}

function gruposDaObra(oid){

  const arr=[...m.values()]; arr.forEach(g=>{ g.ps.sort((a,b)=>a.numero-b.numero); g.ancora=g.ps[0]; g.fixadas=g.ps.filter(p=>p.etiquetada_em).length; });

   +'<div class="card"><h3 style="margin-top:0">Links desta obra</h3>'+(links.length?'<table><tr><th>Para quem</th><th>Situação</th><th></th></tr>'+links.map(l=>'<tr><td><b>'+esc(l.nome)+'</b><div class="small">criado em '+dataHora(l.criado_em)+' · até '+dmy(l.valido_ate)+(l.ultimo_uso_em?' · último uso '+dataHora(l.ultimo_uso_em):' · ainda não usado')+'</div></td><td>'+st(l)+'</td><td>'
     +(linkAtivo(l)?'<button data-act="etqCopiar" data-id="'+l.id+'" style="padding:2px 8px">Copiar</button> <a href="https://wa.me/?text='+encodeURIComponent("Link para etiquetar a obra "+o.nome+": "+urlEtq(l.id))+'" target="_blank" rel="noopener">WhatsApp</a> <button class="danger" data-act="etqCancelar" data-id="'+l.id+'" style="padding:2px 8px">Cancelar</button>':'')+'</td></tr>').join("")+'</table>':'<div class="small">Nenhum link gerado ainda.</div>')+'</div>';

function textoFalta(o){
  const ps=S.pecas.filter(p=>p.obra_id===o.id), c=contaEtapas(ps), por=new Map();
  ps.forEach(p=>{ const a=p.local||"(sem ambiente)"; const x=por.get(a)||{imp:0,fix:0}; if(!p.impressa_em) x.imp++; if(!p.etiquetada_em) x.fix++; por.set(a,x); });
  const linhas=[...por.entries()].filter(([a,x])=>x.imp||x.fix).map(([a,x])=>"• "+a+": "+[x.imp?"imprimir "+x.imp:"",x.fix?"fixar "+x.fix:""].filter(Boolean).join(" · "));
  return "Obra "+o.nome+" — etiquetas\nImpressas "+c.imp+" de "+c.t+" · NFC gravado "+c.nfc+" · Fixadas "+c.fix+" de "+c.t+(linhas.length?"\n\nFaltam:\n"+linhas.join("\n"):"\n\nTudo pronto.");
}
async function etqAbrir(d){
  const oid=Number(d.id); if(!S.etqLinks.length&&!await carregarEtqLinks()) return;
  let l=S.etqLinks.find(x=>x.obra_id===oid&&x.interno&&linkAtivo(x)&&new Date(x.valido_ate)>new Date(Date.now()+864e5));
  if(!l){ const r=await sb.from("v2_etiq_links").insert({obra_id:oid,nome:"Equipe LumiDNA",interno:true,valido_ate:new Date(Date.now()+30*864e5).toISOString()}).select().single();
    if(r.error) return msg("Não consegui abrir a tela de etiquetar: "+r.error.message,false); l=r.data; S.etqLinks.unshift(l); }
  location.href=urlEtq(l.id);
}
async function etqGerar(d){
  const nome=($("#lk_nome").value||"").trim(), dias=parseInt($("#lk_dias").value);
  if(nome.length<3) return msg("Escreva para quem é o link (ex.: LDArti — bancada).",false);
  if(!(dias>=1&&dias<=180)) return msg("A validade deve ser de 1 a 180 dias.",false);
  const r=await sb.from("v2_etiq_links").insert({obra_id:Number(d.id),nome:nome,interno:false,valido_ate:new Date(Date.now()+dias*864e5).toISOString()}).select().single();
  if(r.error) return msg("Erro ao gerar o link: "+r.error.message,false);
  if(!await carregarEtqLinks()) return; renderEtqObra(); msg("Link criado. Use Copiar ou WhatsApp para enviar.");
}
async function etqCopiar(d){ try{ await navigator.clipboard.writeText(urlEtq(d.id)); msg("Link copiado."); }catch(e){ prompt("Copie o link:",urlEtq(d.id)); } }
async function etqCancelar(d){
  if(!confirm("Cancelar este link? Quem estiver com ele deixa de conseguir abrir.")) return;
  const r=await sb.from("v2_etiq_links").update({revogado_em:new Date().toISOString()}).eq("id",d.id);
  if(r.error) return msg("Erro ao cancelar: "+r.error.message,false);
  if(!await carregarEtqLinks()) return; renderEtqObra(); msg("Link cancelado.");
}

// ---- editar peças da obra e itens da peça ----
async function adicionarPeca(){
  const cod=$("#a_lum").value.trim(), q=$("#a_qtd").value.trim()||"1", loc=$("#a_loc").value.trim();
  if(!cod) return msg("Digite o código da luminária.",false);
  S.imp=classificarLinhas([cod+";"+q+";"+loc]);
  if(S.imp[0].status!=="ok"){ const m=S.imp[0].motivo; return msg(m.charAt(0).toUpperCase()+m.slice(1)+".",false); }
  const kitSel=$("#a_kit")?$("#a_kit").value:""; if(kitSel) S.imp[0].kit=S.kits.find(k=>k.id===Number(kitSel))||S.imp[0].kit;
  await criarPecas();
}
function qtdDigitada(id){ const n=parseInt(($("#qn_"+id)||{}).value); return (isNaN(n)||n<1||n>200)?null:n; }
async function maisPeca(d){
  const id=Number(d.id), n=qtdDigitada(id), ps=S.pecas.filter(p=>p.obra_id===S.obra.id&&p.luminaria_id===id), ult=ps[ps.length-1];
  if(!n) return msg("Digite uma quantidade de 1 a 200.",false);
  const rows=Array.from({length:n},()=>({obra_id:S.obra.id,luminaria_id:id,kit_id:ult?ult.kit_id:null,local:ult?ult.local:null}));
  const r=await sb.from("v2_pecas").insert(rows);
  if(r.error) return msg("Erro ao criar as peças: "+r.error.message+" — nada foi criado.",false);
  S.verGrupo.add(id); const oid=S.obra.id; await carregarObras(); abrirObra(oid); msg(n+" peça(s) criada(s) com serial novo.");
}
async function menosPeca(d){
  const id=Number(d.id), n=qtdDigitada(id), ps=S.pecas.filter(p=>p.obra_id===S.obra.id&&p.luminaria_id===id);
  if(!n) return msg("Digite uma quantidade de 1 a 200.",false);
  if(n>ps.length) return msg("Esta obra só tem "+ps.length+" peça(s) dessa luminária.",false);
  const alvo=ps.slice(-n), ids=alvo.map(p=>p.id);
  const h=await sb.from("v2_historico").select("peca_id").in("peca_id",ids).not("tipo","in","(instalada,kit)");
  if(h.error) return msg("Erro ao conferir o histórico: "+h.error.message,false);
  if(h.data.length){ const com=[...new Set(h.data.map(x=>x.peca_id))].map(pid=>alvo.find(p=>p.id===pid).serial); return msg("Estas peças já têm troca ou outro registro no histórico: "+com.join(", ")+". Nada foi excluído. Abra a peça e use Excluir se tiver certeza.",false); }
  if(!confirm("Excluir as "+n+" últimas peças ("+alvo.map(p=>p.serial).join(", ")+")?")) return;
  const r=await sb.from("v2_pecas").delete().in("id",ids);
  if(r.error) return msg("Erro ao excluir: "+r.error.message,false);
  const oid=S.obra.id; await carregarObras(); abrirObra(oid); msg(n+" peça(s) excluída(s).");
}
async function recarregaPeca(){ const id=S.peca; await carregarObras(); await abrirPeca(id); }
async function registraHist(peca,produto,descricao){ const h=await sb.from("v2_historico").insert({peca_id:peca,tipo:"observacao",produto_id:produto,descricao:descricao}); if(h.error) msg("Alteração feita, mas não consegui registrar no histórico: "+h.error.message,false); }
async function salvarQtd(d){
  const it=S.pitens.find(i=>i.id===Number(d.id)), q=parseInt($("#q_novo").value);
  if(isNaN(q)||q<1) return msg("Quantidade precisa ser 1 ou mais.",false);
  if(q===it.quantidade){ S.qtdItem=null; return renderPeca(); }
  const r=await sb.from("v2_peca_itens").update({quantidade:q}).eq("id",it.id);
  if(r.error) return msg("Erro ao salvar: "+r.error.message,false);
  await registraHist(it.peca_id,it.produto_id,"Quantidade de "+porId(it.produto_id).codigo+" alterada de "+it.quantidade+" para "+q);
  S.qtdItem=null; await recarregaPeca(); msg("Quantidade atualizada.");
}
async function removerItem(d){
  const it=S.pitens.find(i=>i.id===Number(d.id)), c=porId(it.produto_id);
  if(!confirm("Retirar "+c.codigo+" desta peça? Ele continua no histórico como item que saiu.")) return;
  const r=await sb.from("v2_peca_itens").update({removido_em:hoje(),motivo_remocao:"outro",observacao:"Retirado sem substituição"}).eq("id",it.id);
  if(r.error) return msg("Erro ao retirar: "+r.error.message,false);
  await registraHist(it.peca_id,it.produto_id,"Item retirado: "+c.codigo);
  await recarregaPeca(); msg("Item retirado.");
}
async function addItemPeca(){
  const pid=Number($("#ad_prod").value), q=parseInt($("#ad_qtd").value);
  if(!pid) return msg("Escolha o item.",false);
  if(isNaN(q)||q<1) return msg("Quantidade precisa ser 1 ou mais.",false);
  const r=await sb.from("v2_peca_itens").insert({peca_id:S.peca,produto_id:pid,quantidade:q,instalado_em:hoje()});
  if(r.error) return msg("Erro ao adicionar: "+r.error.message,false);
  await registraHist(S.peca,pid,"Item adicionado: "+q+"x "+porId(pid).codigo);
  await recarregaPeca(); msg("Item adicionado.");
}

Object.assign(S,{pedidos:[],ped_itens:[],ped:null,pedFiltro:"abertos"});
const ST={novo:"Novo",em_atendimento:"Em atendimento",entregue:"Entregue",instalado:"Instalado",resolvido:"Resolvido",cancelado:"Cancelado",aguardando_aprovacao:"Aguardando aprovação",aprovada:"Aprovada",reprovada:"Reprovada"};
const urgente=p=>p.status==="novo"||p.status==="aguardando_aprovacao";
const TIPO_PED={problema:"Problema",compra:"Compra",manutencao:"Manutenção"};
const ABERTOS=["novo","em_atendimento","entregue","aguardando_aprovacao"];
async function carregarPedidos(){
  try{
    [S.pedidos,S.ped_itens]=await Promise.all([
      pagina(()=>sb.from("v2_pedidos").select("*").order("id",{ascending:false})),
      pagina(()=>sb.from("v2_pedido_itens").select("*").order("id"))
    ]);
  }catch(e){ $("#app").innerHTML='<div class="msg e">Não consegui carregar os pedidos: '+esc(e.message||e)+'<br>Se for "relation does not exist", falta rodar o SQL v2_03_pedidos no Supabase.</div>'; return false; }
  atualizaContPend(); return true;
}
const totalPed=id=>{ const l=S.ped_itens.filter(i=>i.pedido_id===id); return {total:l.reduce((s,i)=>s+(i.preco_unit||0)*i.quantidade,0),sem:l.some(i=>i.preco_unit==null),n:l.length}; };
const dataHora=d=>{ if(!d) return "—"; const x=new Date(d); return x.toLocaleDateString("pt-BR")+" "+x.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); };

function renderPedidos(){
  S.view="pedidos";
  const lista=S.pedidos.filter(p=>S.pedFiltro==="todos"||(S.pedFiltro==="abertos"?ABERTOS.includes(p.status):!ABERTOS.includes(p.status)));
  const abertos=S.pedidos.filter(p=>ABERTOS.includes(p.status)).length, novos=S.pedidos.filter(urgente).length;
  const rows=lista.map(p=>{
    const pc=S.pecas.find(x=>x.id===p.peca_id), t=totalPed(p.id), aberto=ABERTOS.includes(p.status);
    return '<div class="row pdrow" data-act="abrirPedido" data-id="'+p.id+'"><span class="dot '+(urgente(p)?"r":(aberto?"":"g"))+'" '+(!urgente(p)&&aberto?'style="background:#ba7517"':'')+'></span>'
     +'<div><b>#'+p.id+' · '+TIPO_PED[p.tipo]+'</b><div class="small">'+esc(pc?pc.serial:"?")+' · '+dataHora(p.criado_em)+'</div></div>'
     +'<div><b>'+esc(p.contato_nome)+'</b><div class="small">'+(p.em_garantia?'<span class="ok">em garantia</span>':'fora da garantia')+'</div></div>'
     +'<div class="np"><b>'+(t.n?(t.sem?"a combinar":brl(t.total)):"—")+'</b></div><div class="'+(urgente(p)?"no":"small")+'">'+ST[p.status]+'</div></div>';
  }).join("");
  $("#app").innerHTML=navArea("ped")+'<div class="bar"><div class="tabs" style="margin:0">'+[["abertos","Abertos ("+abertos+")"],["encerrados","Encerrados"],["todos","Todos"]].map(x=>'<button class="tab '+(S.pedFiltro===x[0]?"on":"")+'" data-act="filtroPed" data-f="'+x[0]+'">'+x[1]+'</button>').join("")+'</div><div class="small" style="margin-left:auto">'+(novos?'<span class="no"><b>'+novos+'</b> novo(s) sem atendimento</span>':'Nenhum pedido novo')+'</div></div>'
   +(lista.length?'<div class="list">'+rows+'</div>':'<div class="small">Nenhum pedido nesta lista.</div>');
}
function abrirPedido(id){ S.ped=id; renderPedido(); }
function renderPedido(){
  S.view="pedido";
  const pd=S.pedidos.find(x=>x.id===S.ped), pc=S.pecas.find(x=>x.id===pd.peca_id), o=pc&&S.obras.find(x=>x.id===pc.obra_id), l=pc&&porId(pc.luminaria_id);
  const ls=S.ped_itens.filter(i=>i.pedido_id===pd.id), t=totalPed(pd.id), afet=S.pitens.find(i=>i.id===pd.item_afetado_id);
  const g=pc?garantiaTxt(pc):{t:"—",c:"small"};
  const dig=String(pd.contato_fone||"").replace(/\D/g,""), wa=dig.length>=10?"https://wa.me/"+(dig.length<=11?"55":"")+dig:null;
  const bt=(s,rot,cls)=>'<button '+(cls?'class="'+cls+'" ':'')+'data-act="mudaStatus" data-s="'+s+'">'+rot+'</button>';
  let botoes="";
  if(pd.tipo==="compra"){
    if(pd.status==="novo") botoes=bt("em_atendimento","Em atendimento","p")+bt("entregue","Marcar entregue")+bt("cancelado","Cancelar","danger");
    else if(pd.status==="em_atendimento") botoes=bt("entregue","Marcar entregue","p")+bt("cancelado","Cancelar","danger");
    else if(pd.status==="entregue") botoes=bt("instalado","Registrar instalação (cliente não confirmou)","p");
  }else{
    if(pd.status==="novo") botoes=bt("em_atendimento","Em atendimento","p")+bt("resolvido","Resolvido")+bt("cancelado","Cancelar","danger");
    else if(pd.status==="em_atendimento") botoes=bt("resolvido","Resolvido","p")+bt("cancelado","Cancelar","danger");
  }
  $("#app").innerHTML='<div class="bar noprint" style="margin-bottom:12px"><button data-act="voltaPedidos">‹ '+(S.voltaPara==="pend"?"Pendências":"Pedidos")+'</button><button data-act="imprimirPedido" style="margin-left:auto">Imprimir pedido</button></div>'
   +'<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3 style="margin:0">Pedido #'+pd.id+' · '+(pd.tipo==="problema"?"Aviso de problema":(pd.tipo==="manutencao"?"Manutenção informada":"Compra de peças"))+'</h3><b class="'+(pd.status==="novo"?"no":"")+'">'+ST[pd.status]+'</b></div>'
   +'<div class="small" style="margin:4px 0 10px">Recebido em '+dataHora(pd.criado_em)+(pd.entregue_em?' · entregue em '+dataHora(pd.entregue_em):'')+(pd.instalado_em?' · instalado em '+dataHora(pd.instalado_em):'')+'</div>'
   +'<table><tr><th style="width:32%">Peça</th><td>'+(pc?'<a href="#" data-act="abrirPeca" data-id="'+pc.id+'"><b>'+esc(pc.serial)+'</b></a> · '+esc(l?l.codigo:"?")+' · obra '+esc(o?o.nome:"?")+(pc.local?' · '+esc(pc.local):''):'?')+'</td></tr>'
   +'<tr><th>Garantia</th><td><span class="'+g.c+'">'+g.t+'</span> <span class="small">(na hora do pedido: '+(pd.em_garantia?"em garantia":"fora da garantia")+')</span></td></tr>'
   +'<tr><th>Cliente</th><td><b>'+esc(pd.contato_nome)+'</b> · '+esc(pd.contato_fone)+(wa?' · <a href="'+wa+'" target="_blank" rel="noopener">chamar no WhatsApp</a>':'')+'</td></tr>'
   +(pd.contato_email?'<tr><th>E-mail</th><td><a href="mailto:'+esc(pd.contato_email)+'">'+esc(pd.contato_email)+'</a></td></tr>':'')
   +(pd.documento?'<tr><th>CPF / CNPJ</th><td>'+esc(fmtDoc(pd.documento))+'</td></tr>':'')
   +(pd.endereco?'<tr><th>Entrega</th><td>'+esc(txtEndereco(pd.endereco))+'</td></tr>':'')
   +(pd.forma_pagamento?'<tr><th>Pagamento</th><td><b>'+esc(PAG[pd.forma_pagamento]||pd.forma_pagamento)+'</b> · <span class="'+(pd.pagamento_status==="pago"?"ok":"no")+'">'+esc(PAGST[pd.pagamento_status]||"—")+'</span>'+(String(pd.pagamento_ref||"").startsWith("DEMO")?' <b class="no">· SIMULADO (demonstração, não é dinheiro real)</b>':'')+'</td></tr>':'')

const PAG={pix:"PIX",cartao:"Cartão de crédito",boleto:"Boleto"};
const PAGST={aguardando_confirmacao:"Aguardando confirmação",aguardando_pagamento:"Aguardando pagamento",pago:"Pago",cancelado:"Cancelado",estornado:"Estornado"};
const fmtDoc=v=>{ const d=String(v||"").replace(/\D/g,""); return d.length===11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4"):(d.length===14?d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,"$1.$2.$3/$4-$5"):d); };
const txtEndereco=e=>{ if(!e) return ""; return [ (e.rua||"")+(e.numero?", "+e.numero:"")+(e.complemento?" ("+e.complemento+")":""), e.bairro, (e.cidade||"")+(e.uf?"/"+e.uf:""), e.cep?"CEP "+String(e.cep).replace(/(\d{5})(\d{3})/,"$1-$2"):"" ].filter(Boolean).join(" · "); };
// pagamento: a empresa confere preço, prazo e frete, define o valor final e libera o pagamento
function painelPag(pd,t){
  if(!pd.forma_pagamento) return "";
  const sug=(t.sem?null:t.total+(pd.frete||0));
  const vf=pd.valor_final!=null?pd.valor_final:sug;
  return '<div class="card noprint"><h3 style="margin-top:0">Pagamento</h3>'
   +'<div class="small" style="margin-bottom:10px">O cliente escolheu <b>'+esc(PAG[pd.forma_pagamento])+'</b>. Nada foi cobrado. Confira preço, prazo e frete, defina o valor final e libere o pagamento. Dados de cartão nunca ficam no sistema.</div>'
   +'<div class="grid"><div class="field"><label>Frete (R$)</label><input id="pg_frete" inputmode="decimal" value="'+(pd.frete!=null?String(pd.frete).replace(".",","):"")+'" placeholder="0,00"></div>'
   +'<div class="field"><label>Valor final a cobrar (R$)</label><input id="pg_valor" inputmode="decimal" value="'+(vf!=null?String(vf).replace(".",","):"")+'" placeholder="itens + frete"></div>'
   +'<div class="field"><label>Situação do pagamento</label><select id="pg_status">'+Object.keys(PAGST).map(k=>'<option value="'+k+'" '+(pd.pagamento_status===k?"selected":"")+'>'+PAGST[k]+'</option>').join("")+'</select></div></div>'
   +'<div class="small" style="margin-bottom:10px">Itens: '+(t.sem?'a combinar':brl(t.total))+(pd.pago_em?' · pago em '+dataHora(pd.pago_em):'')+'</div>'
   +(pd.token?'<div class="small" style="margin-bottom:10px">Link do cliente (acompanhar e pagar): <a href="../pedido/?n='+pd.id+'&t='+esc(pd.token)+'" target="_blank" rel="noopener">abrir</a> · <a href="#" data-act="copiaLinkPedido">copiar link</a></div>':'')
   +'<button class="p" data-act="salvarPag">Salvar pagamento</button></div>';
}
async function salvarPag(){
  const pd=S.pedidos.find(x=>x.id===S.ped);
  const frete=num($("#pg_frete").value), valor=num($("#pg_valor").value), st=$("#pg_status").value;
  if(frete!=null&&frete<0) return msg("O frete não pode ser negativo.",false);
  if(valor!=null&&valor<0) return msg("O valor final não pode ser negativo.",false);
  if((st==="aguardando_pagamento"||st==="pago")&&!(valor>0)) return msg("Defina o valor final antes de liberar ou marcar como pago.",false);
  if(st==="pago"&&pd.pagamento_status!=="pago"&&!confirm("Marcar o pedido #"+pd.id+" como PAGO no valor de "+brl(valor)+"?")) return;
  const row={frete:frete,valor_final:valor,pagamento_status:st};
  if(st==="pago"&&pd.pagamento_status!=="pago") row.pago_em=new Date().toISOString();
  if(st!=="pago") row.pago_em=null;
  const r=await sb.from("v2_pedidos").update(row).eq("id",pd.id);
  if(r.error) return msg("Erro ao salvar o pagamento: "+r.error.message,false);
  if(st!==pd.pagamento_status){ if(st==="aguardando_pagamento") avisarEvento("liberado",pd.id,pd.token); else if(st==="pago") avisarEvento("pago",pd.id,pd.token); }
  await carregarPedidos(); renderPedido(); msg("Pagamento do pedido #"+pd.id+" salvo."+(st==="aguardando_pagamento"&&pd.pagamento_status!=="aguardando_pagamento"?" O cliente já pode pagar pelo link do pedido.":""));
}
async function mudaStatus(d){
  const pd=S.pedidos.find(x=>x.id===S.ped), s=d.s;
  if(s==="cancelado"&&!confirm("Cancelar o pedido #"+pd.id+"?")) return;
  if(s==="instalado"&&!confirm("Registrar a instalação troca os itens da peça e grava no histórico. Confirma?")) return;
  const r=await sb.rpc("v2_mudar_status_pedido",{p_pedido:pd.id,p_status:s,p_obs:nv(($("#pd_obs").value||"").trim())});
  if(r.error) return msg("Erro: "+r.error.message,false);
  await Promise.all([carregarPedidos(),carregarObras()]); renderPedido(); msg("Pedido #"+pd.id+": "+ST[s]+".");
}
async function salvarObsPedido(){
  const pd=S.pedidos.find(x=>x.id===S.ped);
  const r=await sb.rpc("v2_mudar_status_pedido",{p_pedido:pd.id,p_status:pd.status,p_obs:nv(($("#pd_obs").value||"").trim())});
  if(r.error) return msg("Erro: "+r.error.message,false);
  await carregarPedidos(); renderPedido(); msg("Anotação salva.");
}

Object.assign(S,{relTab:"manut",relDe:"",relAte:"",relObra:null,relExp:null});
const isoLocal=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const diaDe=d=>!d?"":(/^\d{4}-\d\d-\d\d$/.test(String(d))?String(d):isoLocal(new Date(d)));
const noPeriodo=d=>{ const s=diaDe(d); if(!s) return true; return !!((S.relDe&&s<S.relDe)||(S.relAte&&s>S.relAte)); };
const FALHA=["parou de funcionar","piscando","perdeu brilho"];
const pcMap=()=>new Map(S.pecas.map(p=>[p.id,p]));
const pct=(a,b)=>b?Math.round(a*1000/b)/10+"%":"—";
const mesDe=d=>{ const s=diaDe(d); return s.slice(5,7)+"/"+s.slice(0,4); };
function baixarCsv(nome,cab,linhas){
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const t="﻿"+[cab].concat(linhas).map(l=>l.map(q).join(";")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"})); a.download=nome; document.body.appendChild(a); a.click(); a.remove();
}
const metrica=(rot,val,sub)=>'<div style="flex:1;min-width:140px;background:var(--soft);border-radius:8px;padding:10px 12px"><div class="small">'+rot+'</div><div style="font-size:20px;font-weight:600">'+val+'</div>'+(sub?'<div class="small">'+sub+'</div>':'')+'</div>';

function eventosManut(){
  const pm=pcMap(), ev=[];
  S.pitens.filter(i=>i.removido_em&&!noPeriodo(i.removido_em)).forEach(i=>{
    const p=pm.get(i.peca_id); if(!p) return; const c=porId(i.produto_id);
    ev.push({obra:p.obra_id,peca:p.id,data:i.removido_em,serial:p.serial,tipo:"Troca",desc:i.quantidade+"x "+(c?c.codigo:"?"),motivo:i.motivo_remocao||"",un:i.quantidade});
  });
  S.pedidos.filter(pd=>!noPeriodo(pd.criado_em)).forEach(pd=>{
    const p=pm.get(pd.peca_id); if(!p) return;
    ev.push({obra:p.obra_id,peca:p.id,data:diaDe(pd.criado_em),serial:p.serial,tipo:pd.tipo==="problema"?"Problema":(pd.tipo==="manutencao"?"Manutenção informada":"Pedido de peças"),desc:"Pedido #"+pd.id+" · "+ST[pd.status],motivo:pd.motivo||"",un:0});
  });
  return ev;
}
function relManut(){
  const ev=eventosManut();
  if(S.relObra){
    const o=S.obras.find(x=>x.id===S.relObra), e=ev.filter(x=>x.obra===o.id).sort((a,b)=>a.data<b.data?1:-1);
    S.relExp={nome:"manutencao-"+o.nome+".csv",cab:["Data","Peça","Ocorrência","Detalhe","Motivo"],rows:e.map(x=>[dmy(x.data),x.serial,x.tipo,x.desc,x.motivo])};
    const porMotivo={}; e.filter(x=>x.tipo==="Troca").forEach(x=>{ porMotivo[x.motivo||"sem motivo"]=(porMotivo[x.motivo||"sem motivo"]||0)+x.un; });
    return '<button data-act="relVoltaObra" style="margin-bottom:10px">‹ Todas as obras</button><h3 style="margin:0 0 8px">'+esc(o.nome)+'</h3>'
     +'<div class="small" style="margin-bottom:8px">Unidades trocadas por motivo: '+(Object.keys(porMotivo).length?Object.entries(porMotivo).map(x=>esc(x[0])+": <b>"+x[1]+"</b>").join(" · "):"nenhuma")+'</div>'
     +(e.length?'<table><tr><th>Data</th><th>Peça</th><th>Ocorrência</th><th>Detalhe</th><th>Motivo</th></tr>'+e.map(x=>'<tr><td>'+dmy(x.data)+'</td><td>'+esc(x.serial)+'</td><td>'+x.tipo+'</td><td>'+esc(x.desc)+'</td><td>'+esc(x.motivo)+'</td></tr>').join("")+'</table>':'<div class="small">Nenhuma ocorrência no período.</div>');
  }
  const linhas=S.obras.map(o=>{
    const ps=S.pecas.filter(p=>p.obra_id===o.id), e=ev.filter(x=>x.obra===o.id);
    return {o:o,ps:ps.length,prob:e.filter(x=>x.tipo==="Problema").length,trocas:e.filter(x=>x.tipo==="Troca").reduce((s,x)=>s+x.un,0),ped:e.filter(x=>x.tipo==="Pedido de peças").length,comOc:new Set(e.filter(x=>x.tipo==="Problema"||x.tipo==="Troca").map(x=>x.peca)).size};
  }).sort((a,b)=>b.comOc-a.comOc||b.trocas-a.trocas);
  S.relExp={nome:"manutencao-por-obra.csv",cab:["Obra","Peças","Peças com ocorrência","% com ocorrência","Avisos de problema","Unidades trocadas","Pedidos de peças"],rows:linhas.map(l=>[l.o.nome,l.ps,l.comOc,pct(l.comOc,l.ps),l.prob,l.trocas,l.ped])};
  const tot=linhas.reduce((a,l)=>({ps:a.ps+l.ps,oc:a.oc+l.comOc,pr:a.pr+l.prob,tr:a.tr+l.trocas}),{ps:0,oc:0,pr:0,tr:0});
  return '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">'+metrica("Peças instaladas",tot.ps)+metrica("Peças com ocorrência",tot.oc,pct(tot.oc,tot.ps))+metrica("Avisos de problema",tot.pr)+metrica("Unidades trocadas",tot.tr)+'</div>'
   +(linhas.length?'<table><tr><th>Obra</th><th>Peças</th><th>Com ocorrência</th><th>Avisos</th><th>Unid. trocadas</th><th>Pedidos de peças</th></tr>'+linhas.map(l=>'<tr style="cursor:pointer" data-act="relAbrirObra" data-id="'+l.o.id+'"><td><b>'+esc(l.o.nome)+'</b></td><td>'+l.ps+'</td><td>'+l.comOc+' <span class="small">('+pct(l.comOc,l.ps)+')</span></td><td>'+l.prob+'</td><td>'+l.trocas+'</td><td>'+l.ped+'</td></tr>').join("")+'</table><div class="small" style="margin-top:6px">Clique numa obra para ver as ocorrências.</div>':'<div class="small">Nenhuma obra ainda.</div>');
}

function relVendas(){
  const vend=S.pedidos.filter(p=>p.tipo==="compra"&&(p.status==="entregue"||p.status==="instalado")&&!noPeriodo(p.entregue_em));
  const aberto=S.pedidos.filter(p=>p.tipo==="compra"&&(p.status==="novo"||p.status==="em_atendimento"));
  const val=p=>totalPed(p.id).total, soma=l=>l.reduce((s,p)=>s+val(p),0);
  const semPreco=vend.filter(p=>totalPed(p.id).sem).length, emGar=vend.filter(p=>p.em_garantia);
  const pm=pcMap(), agr=(chave)=>{ const m=new Map(); vend.forEach(p=>{ const k=chave(p); const r=m.get(k)||{n:0,t:0}; r.n++; r.t+=val(p); m.set(k,r); }); return [...m.entries()]; };
  const porMes=agr(p=>diaDe(p.entregue_em).slice(0,7)).sort((a,b)=>a[0]<b[0]?1:-1);
  const porObra=agr(p=>{ const pc=pm.get(p.peca_id), o=pc&&S.obras.find(x=>x.id===pc.obra_id); return o?o.nome:"?"; }).sort((a,b)=>b[1].t-a[1].t);
  const itens=new Map(); S.ped_itens.filter(i=>vend.some(p=>p.id===i.pedido_id)).forEach(i=>{ const r=itens.get(i.descricao)||{q:0,t:0}; r.q+=i.quantidade; r.t+=(i.preco_unit||0)*i.quantidade; itens.set(i.descricao,r); });
  const porItem=[...itens.entries()].sort((a,b)=>b[1].t-a[1].t);
  S.relExp={nome:"vendas.csv",cab:["Pedido","Entregue em","Obra","Peça","Cliente","Em garantia","Total"],rows:vend.map(p=>{ const pc=pm.get(p.peca_id), o=pc&&S.obras.find(x=>x.id===pc.obra_id); return [p.id,dmy(diaDe(p.entregue_em)),o?o.nome:"",pc?pc.serial:"",p.contato_nome,p.em_garantia?"sim":"não",val(p).toFixed(2).replace(".",",")]; })};
  const tab=(tit,cab,linhas)=>'<h4 style="margin:16px 0 6px">'+tit+'</h4>'+(linhas.length?'<table><tr>'+cab.map(c=>'<th>'+c+'</th>').join("")+'</tr>'+linhas.map(l=>'<tr>'+l.map(c=>'<td>'+c+'</td>').join("")+'</tr>').join("")+'</table>':'<div class="small">Sem dados no período.</div>');
  return '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px">'+metrica("Vendido (entregue)",brl(soma(vend)),vend.length+" pedido(s)")+metrica("Ticket médio",vend.length?brl(soma(vend)/vend.length):"—")+metrica("Dos quais em garantia",brl(soma(emGar)),emGar.length+" pedido(s)")+metrica("Orçamentos em aberto",brl(soma(aberto)),aberto.length+" pedido(s)")+'</div>'
   +(semPreco?'<div class="no" style="margin-bottom:6px">'+semPreco+' pedido(s) têm item sem preço; o total deles está incompleto.</div>':'')
   +'<div class="small">Conta como venda o pedido de compra marcado Entregue ou Instalado, pela data da entrega. Pedido em garantia aparece separado porque pode não ser cobrado.</div>'
   +tab("Por mês",["Mês","Pedidos","Total"],porMes.map(x=>[x[0].slice(5)+"/"+x[0].slice(0,4),x[1].n,brl(x[1].t)]))
   +tab("Por obra",["Obra","Pedidos","Total"],porObra.map(x=>[esc(x[0]),x[1].n,brl(x[1].t)]))
   +tab("Por item",["Item","Unidades","Total"],porItem.map(x=>[esc(x[0]),x[1].q,brl(x[1].t)]));
}

function relFalham(){
  const m=new Map();
  S.pitens.forEach(i=>{
    const r=m.get(i.produto_id)||{id:i.produto_id,inst:0,falha:0,prev:0,outro:0,dias:0,dq:0};
    r.inst+=i.quantidade;
    if(i.removido_em&&!noPeriodo(i.removido_em)){
      if(FALHA.includes(i.motivo_remocao)){ r.falha+=i.quantidade; r.dias+=((new Date(i.removido_em)-new Date(i.instalado_em))/86400000)*i.quantidade; r.dq+=i.quantidade; }
      else if(i.motivo_remocao==="troca preventiva") r.prev+=i.quantidade; else r.outro+=i.quantidade;
    }
    m.set(i.produto_id,r);
  });
  const linhas=[...m.values()].filter(r=>porId(r.id)).sort((a,b)=>b.falha-a.falha||(b.falha/b.inst)-(a.falha/a.inst)||b.inst-a.inst);
  const nome=r=>{ const c=porId(r.id); return TIPO1[c.tipo]+" "+c.codigo+(c.fabricante?" ("+c.fabricante+")":""); };
  const media=r=>r.dq?Math.round(r.dias/r.dq)+" dias":"—";
  S.relExp={nome:"componentes-que-mais-falham.csv",cab:["Item","Instalados (total)","Trocados por falha","Taxa de falha","Troca preventiva","Outros motivos","Tempo médio até falhar (dias)"],rows:linhas.map(r=>[nome(r),r.inst,r.falha,pct(r.falha,r.inst),r.prev,r.outro,r.dq?Math.round(r.dias/r.dq):""])};
  const comFalha=linhas.filter(r=>r.falha>0).length;
  return '<div class="small" style="margin-bottom:8px">Falha = item trocado por "parou de funcionar", "piscando" ou "perdeu brilho". Troca preventiva e outros motivos aparecem à parte e não entram na taxa. Instalados = todas as unidades que já entraram em peças. Com poucas peças e pouco tempo de uso, os números ainda não dizem muito.</div>'
   +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">'+metrica("Itens diferentes instalados",linhas.length)+metrica("Itens com falha registrada",comFalha)+metrica("Unidades que falharam",linhas.reduce((s,r)=>s+r.falha,0))+'</div>'
   +(linhas.length?'<table><tr><th>Item</th><th>Instalados</th><th>Falharam</th><th>Taxa</th><th>Tempo médio até falhar</th><th>Preventiva</th><th>Outros</th></tr>'+linhas.map(r=>'<tr><td><b>'+esc(nome(r))+'</b></td><td>'+r.inst+'</td><td class="'+(r.falha?"no":"")+'">'+r.falha+'</td><td>'+pct(r.falha,r.inst)+'</td><td>'+media(r)+'</td><td>'+r.prev+'</td><td>'+r.outro+'</td></tr>').join("")+'</table>':'<div class="small">Nenhum item instalado ainda.</div>');
}

// ---- similares homologados (cadastro no item) ----
Object.assign(S,{similares:[],apSel:null});
function grupoSim(id){
  const vis=new Set([id]), fila=[id];
  while(fila.length){ const x=fila.pop(); S.similares.forEach(s=>{ const o=s.original_id===x?s.similar_id:(s.similar_id===x?s.original_id:null); if(o&&!vis.has(o)){ vis.add(o); fila.push(o); } }); }
  vis.delete(id); return [...vis].map(porId).filter(Boolean);
}
function desenhaSimilares(){
  const box=$("#sim_box"); if(!box||!S.cur||!S.cur.id) return;
  const p=S.cur;
  const sims=S.similares.filter(s=>s.original_id===p.id).map(s=>porId(s.similar_id)).filter(Boolean);
  const deQuem=S.similares.filter(s=>s.similar_id===p.id).map(s=>porId(s.original_id)).filter(Boolean);
  box.innerHTML='<div class="field"><label>Similares homologados (podem substituir este item)</label><div class="pills">'
   +(sims.length?sims.map(c=>'<span>'+esc(c.codigo)+' <a href="#" data-act="tirarSimilar" data-id="'+c.id+'" title="Remover">✕</a></span>').join(""):'<span class="small">nenhum ainda</span>')+'</div>'
   +'<input id="sm_busca" placeholder="Buscar no catálogo o item que você homologa como similar" style="margin-top:6px"><div class="box" id="sm_res" style="display:none;margin-top:6px"></div>'
   +'<div class="small" style="margin-top:4px">O similar precisa estar cadastrado no catálogo, do mesmo tipo (LED com LED, driver com driver). Quando o cliente comprar ou informar um similar daqui, a empresa já sabe que é homologado.</div>'
   +(grupoSim(p.id).length?'<div class="small" style="margin-top:6px">Grupo aprovado (podem trocar uns pelos outros, inclusive o original): <b>'+grupoSim(p.id).map(c=>esc(c.codigo)).join(", ")+'</b></div>':'')+'</div>';
  $("#sm_busca").oninput=()=>{
    const t=norm($("#sm_busca").value), res=$("#sm_res");
    if(!t){ res.style.display="none"; return; }
    const ja=new Set(sims.map(x=>x.id));
    const r=S.produtos.filter(x=>x.tipo===p.tipo&&x.id!==p.id&&!ja.has(x.id)&&(norm(x.codigo).includes(t)||norm(x.fabricante).includes(t))).slice(0,8);
    res.style.display=""; res.innerHTML=r.length?r.map(x=>'<label style="cursor:pointer" data-act="addSimilar" data-id="'+x.id+'">+ <b>'+esc(x.codigo)+'</b> <span class="small">'+(esc(x.fabricante)||"")+(x.preco!=null?' · '+brl(x.preco):'')+'</span></label>').join(""):'<div class="small">Nada encontrado. Cadastre o item no catálogo primeiro.</div>';
  };
}
async function recarregaSimilares(){ const r=await sb.from("v2_similares").select("*"); if(!r.error) S.similares=r.data; return !r.error; }
async function addSimilar(d){
  const r=await sb.from("v2_similares").insert({original_id:S.cur.id,similar_id:Number(d.id)});
  if(r.error) return msg(r.error.code==="23505"?"Esse similar já está cadastrado.":"Erro ao homologar: "+r.error.message,false);
  await recarregaSimilares(); msg(""); desenhaSimilares();
}
async function tirarSimilar(d){
  const r=await sb.from("v2_similares").delete().eq("original_id",S.cur.id).eq("similar_id",Number(d.id));
  if(r.error) return msg("Erro ao remover: "+r.error.message,false);
  await recarregaSimilares(); desenhaSimilares();
}

// ---- aprovação de manutenção informada pelo cliente ----
function painelMan(pd){
  const it=S.pitens.find(i=>i.id===pd.item_afetado_id), c=it&&porId(it.produto_id), sim=pd.similar_id&&porId(pd.similar_id), aberta=pd.status==="aguardando_aprovacao";
  let oque;
  if(pd.man_origem==="original") oque='O mesmo item original ('+esc(c?c.codigo:"?")+') <span class="ok">homologado</span>';
  else if(pd.man_origem==="similar") oque='Similar <b>'+esc(sim?sim.codigo:"?")+'</b> <span class="ok">homologado</span>';
  else oque='<span class="no">Não homologado</span>: modelo <b>'+esc(pd.modelo_informado||"?")+'</b>'+(pd.fabricante_informado?' · '+esc(pd.fabricante_informado):'');
  let decisao="";
  if(aberta){
    let escolha="";
    if(pd.man_origem==="outro") escolha='<div class="field"><label>Qual item do catálogo ficou instalado? *</label><input id="ap_busca" placeholder="Buscar no catálogo (mesmo tipo)"><div class="box" id="ap_res" style="display:none;margin-top:6px"></div><div style="margin-top:6px">Escolhido: <b id="ap_sel">nenhum</b></div>'
      +'<button data-act="cadNovoMan" style="margin-top:6px">Não existe: cadastrar "'+esc(pd.modelo_informado||"")+'" como item novo</button>'
      +'<label style="display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink);margin-top:10px"><input type="checkbox" id="ap_hom"> Homologar como similar de '+esc(c?c.codigo:"?")+' (os próximos clientes já veem como homologado)</label></div>';
    decisao='<div class="card" style="background:var(--soft);margin-top:10px">'+escolha+'<div class="field"><label>Mensagem para o cliente (obrigatória se reprovar)</label><input id="ap_msg"></div>'
      +'<div class="bar"><button class="p" data-act="decidirMan" data-v="1">Aprovar e atualizar a peça</button><button class="danger" data-act="decidirMan" data-v="0">Reprovar</button></div>'
      +'<div class="small">Ao aprovar, o item da peça é trocado e o histórico registra a manutenção. Se a garantia deve mudar, ajuste na ficha da peça.</div></div>';
  }else decisao='<div class="small" style="margin-top:8px"><b>'+ST[pd.status]+'</b> em '+dataHora(pd.decidido_em)+(pd.decisao_msg?' · mensagem ao cliente: '+esc(pd.decisao_msg):'')+'</div>';
  return '<div class="card"><h3 style="margin-top:0">Manutenção informada pelo cliente</h3><table><tr><th style="width:32%">Item trocado</th><td>'+esc(c?c.codigo:"?")+(pd.quantidade_man?' · '+pd.quantidade_man+' unidade(s)':'')+'</td></tr><tr><th>Foi instalado</th><td>'+oque+'</td></tr></table><div id="man_foto" style="margin-top:10px"></div>'+decisao+'</div>';
}
async function posPedido(pd){
  if(pd.tipo!=="manutencao") return;
  if(pd.man_origem==="outro"){
    const r=await sb.from("v2_pedido_fotos").select("dados").eq("pedido_id",pd.id).limit(1), el=$("#man_foto");
    if(el&&r.data&&r.data[0]) el.innerHTML='<div class="small">Foto enviada pelo cliente:</div><img src="'+esc(r.data[0].dados)+'" alt="Foto enviada pelo cliente" style="max-width:100%;max-height:360px;border:1px solid var(--line);border-radius:8px">';
    else if(el) el.innerHTML='<div class="no">Sem foto anexada.</div>';
  }
  const b=$("#ap_busca"); if(!b) return;
  const it=S.pitens.find(i=>i.id===pd.item_afetado_id), orig=it&&porId(it.produto_id);
  b.oninput=()=>{
    const t=norm(b.value), box=$("#ap_res");
    if(!t){ box.style.display="none"; return; }
    const r=S.produtos.filter(p=>orig&&p.tipo===orig.tipo&&p.id!==orig.id&&(norm(p.codigo).includes(t)||norm(p.fabricante).includes(t))).slice(0,8);
    box.style.display=""; box.innerHTML=r.length?r.map(p=>'<label style="cursor:pointer" data-act="pickAp" data-id="'+p.id+'">+ <b>'+esc(p.codigo)+'</b> <span class="small">'+(esc(p.fabricante)||"")+'</span></label>').join(""):'<div class="small">Nada encontrado.</div>';
  };
}
function pickAp(d){ S.apSel=Number(d.id); $("#ap_sel").textContent=porId(S.apSel).codigo; $("#ap_res").style.display="none"; $("#ap_busca").value=""; }
async function cadNovoMan(){
  const pd=S.pedidos.find(x=>x.id===S.ped), it=S.pitens.find(i=>i.id===pd.item_afetado_id), orig=it&&porId(it.produto_id);
  if(!orig||!pd.modelo_informado) return msg("Faltam dados para cadastrar o item.",false);
  const ja=S.produtos.find(p=>p.tipo===orig.tipo&&norm(p.codigo)===norm(pd.modelo_informado));
  if(ja){ S.apSel=ja.id; $("#ap_sel").textContent=ja.codigo; return msg("Esse modelo já existe no catálogo; selecionei ele.",true); }
  const r=await sb.from("v2_produtos").insert({tipo:orig.tipo,codigo:pd.modelo_informado,fabricante:nv(pd.fabricante_informado),integrada:false,detalhes:{}}).select().single();
  if(r.error) return msg("Erro ao cadastrar: "+r.error.message,false);
  await carregar(); S.apSel=r.data.id; $("#ap_sel").textContent=r.data.codigo;
  msg('"'+r.data.codigo+'" foi cadastrado no catálogo (incompleto: falta preço, foto e dados). Complete depois na aba Catálogo.',true);
}
async function decidirMan(d){
  const pd=S.pedidos.find(x=>x.id===S.ped), aprovar=d.v==="1", texto=($("#ap_msg").value||"").trim();
  let prod=null;
  if(aprovar){ if(pd.man_origem==="outro"){ prod=S.apSel; if(!prod) return msg("Escolha o item do catálogo que ficou instalado (ou cadastre o novo) antes de aprovar.",false); } }
  else if(!texto) return msg("Escreva o motivo da reprovação para o cliente.",false);
  if(!confirm(aprovar?"Aprovar e trocar o item na peça?":"Reprovar esta manutenção?")) return;
  const hom=!!($("#ap_hom")&&$("#ap_hom").checked);
  const r=await sb.rpc("v2_decidir_manutencao",{p_pedido:pd.id,p_aprovar:aprovar,p_produto:prod,p_homologar:hom,p_msg:nv(texto)});
  if(r.error) return msg("Erro: "+r.error.message,false);
  S.apSel=null; await Promise.all([carregarPedidos(),carregarObras(),recarregaSimilares()]); renderPedido(); msg(aprovar?"Manutenção aprovada e peça atualizada.":"Manutenção reprovada.");
}

// ---- situações especiais da peça (notas da empresa, no histórico) ----
const PREF_NOTA="Nota da empresa: ";
function blocoNotas(){
  const notas=S.hist.filter(h=>h.tipo==="observacao"&&String(h.descricao||"").startsWith(PREF_NOTA));
  return '<div class="card"><div class="bar" style="margin-bottom:8px"><h3 style="margin:0">Situações especiais</h3><div style="margin-left:auto"><button class="p" data-act="notaAbrir">'+(S.notaAberta?"Cancelar":"+ Registrar situação especial")+'</button></div></div>'
   +(S.notaAberta?'<div class="field"><label>O que aconteceu nesta peça?</label><textarea id="nota_txt" style="min-height:90px" placeholder="Ex.: Foi preciso trocar o soquete e a lâmpada porque não havia altura."></textarea><div class="small" style="margin-top:4px">Fica gravado no histórico da peça, com data, e só a empresa vê. Não dá para apagar; se errar, registre outra nota corrigindo.</div></div><div class="bar"><button class="p" data-act="notaSalvar">Salvar situação</button></div>':'')
   +(notas.length?notas.map(h=>'<div class="prow"><div class="small">'+dataHora(h.data)+'</div><div>'+esc(h.descricao.slice(PREF_NOTA.length))+'</div></div>').join(""):(S.notaAberta?'':'<div class="small">Nenhuma situação registrada. Use o botão para anotar algo especial, por exemplo: trocou o soquete e a lâmpada por falta de altura.</div>'))+'</div>';
}
async function notaSalvar(){
  const t=($("#nota_txt").value||"").trim();
  if(!t) return msg("Escreva o que aconteceu.",false);
  if(t.length>1000) return msg("Texto muito longo (máximo 1000 caracteres).",false);
  const r=await sb.from("v2_historico").insert({peca_id:S.peca,tipo:"observacao",descricao:PREF_NOTA+t});
  if(r.error) return msg("Erro ao salvar: "+r.error.message,false);
  await abrirPeca(S.peca); msg("Situação registrada no histórico da peça.");
}

// ---- pendências (botão do menu com contador) ----
Object.assign(S,{contPend:{prob:0,man:0,apr:0},voltaPara:null});
const badgePend=()=>{ const n=S.contPend.prob+S.contPend.man; return '<span class="badgePend" style="background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-left:4px;'+(n?"":"display:none")+'">'+n+'</span>'; };
async function atualizaContPend(){
  const r=await sb.from("v2_pedidos").select("tipo,status").in("status",["novo","em_atendimento","aguardando_aprovacao","aprovada"]);
  if(r.error) return;
  S.contPend={prob:r.data.filter(p=>p.tipo==="problema"&&(p.status==="novo"||p.status==="em_atendimento")).length,
              man:r.data.filter(p=>p.tipo==="manutencao"&&p.status==="aguardando_aprovacao").length,
              apr:r.data.filter(p=>p.tipo==="manutencao"&&p.status==="aprovada").length};
  const n=S.contPend.prob+S.contPend.man;
  document.querySelectorAll(".badgePend").forEach(b=>{ b.textContent=n; b.style.display=n?"":"none"; });
}
function renderPend(){
  S.view="pend";
  const pc=pcMap(), serial=p=>{ const x=pc.get(p.peca_id); return x?x.serial:"?"; };
  const prob=S.pedidos.filter(p=>p.tipo==="problema"&&(p.status==="novo"||p.status==="em_atendimento"));
  const man=S.pedidos.filter(p=>p.tipo==="manutencao"&&p.status==="aguardando_aprovacao");
  const apr=S.pedidos.filter(p=>p.tipo==="manutencao"&&p.status==="aprovada");
  const linha=p=>'<div class="row pnrow" data-act="abrirPendente" data-id="'+p.id+'"><div><b>'+esc(serial(p))+'</b><div class="small">'+dataHora(p.criado_em)+'</div></div><div class="small">'+esc(p.contato_nome)+(p.motivo?' · '+esc(p.motivo):'')+'</div><div class="'+(urgente(p)?"no":"small")+'">'+ST[p.status]+'</div></div>';
  const bloco=(tit,n,lista,vazio,extra)=>'<div class="card"><div style="display:flex;align-items:center;gap:14px"><div style="font-size:36px;font-weight:700;line-height:1;color:'+(n?"var(--redt)":"var(--ink)")+'">'+n+'</div><div><b>'+tit+'</b>'+(extra||"")+'</div></div>'
    +(lista.length?'<div class="list" style="margin-top:12px">'+lista.map(linha).join("")+'</div>':'<div class="small" style="margin-top:8px">'+vazio+'</div>')+'</div>';
  $("#app").innerHTML=navArea("pend")
   +bloco("Problemas em aberto",prob.length,prob,"Nenhum problema em aberto.","")
   +bloco("Manutenções aguardando aprovação",man.length,man,"Nenhuma manutenção aguardando aprovação.",'<div class="small">'+apr.length+' manutenção(ões) já aprovada(s)</div>');
}

async function iniciar(){
  const s=await sb.auth.getSession();
  if(!s.data.session) return telaLogin();
  $("#quem").innerHTML=`${esc(s.data.session.user.email)} · <a href="#" id="sair">Sair</a>`;
  $("#sair").onclick=async e=>{e.preventDefault();await sb.auth.signOut();telaLogin()};
  if(await carregar()){ await atualizaContPend(); renderHome(); if(!window._ptim) window._ptim=setInterval(atualizaContPend,60000); }
}
iniciar();
