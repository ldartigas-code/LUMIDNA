<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e13"><meta name="color-scheme" content="dark">
<title>LumiDNA — sua luminária</title>
<style>
:root{color-scheme:dark;--bg:#0a0e13;--s1:#111821;--s2:#172130;--ink:#eef2f7;--muted:#8896a8;--line:#1f2b3b;--orange:#ff7a2f;--green:#34d399;--red:#f87171;--amber:#f5b942}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Inter,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:110px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(900px 380px at 50% -120px,rgba(255,122,47,.16),transparent 70%);background-repeat:no-repeat}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 4px}
.logo{font-weight:800;letter-spacing:-.03em;font-size:20px}.logo b{color:var(--orange)}
.badge{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.small{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:20px}
.hero{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:4px}
.comp{border-radius:14px;background:radial-gradient(circle at 50% 30%,#2a3a52,#131c29 70%);border:1px solid var(--line);padding:8px;margin-bottom:18px;display:flex;flex-direction:column;gap:8px}
.comp .main{aspect-ratio:16/9;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px}
.comp .main img,.comp .kb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.kitrow{display:grid;gap:8px}
.kb{aspect-ratio:1/1;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px}
.kitrow.solo .kb{aspect-ratio:4/3}
.comp .cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2px 2px -2px}
.photo{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2a3a52,#131c29 70%);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px;padding:6px}
.photo img{max-width:100%;max-height:100%;object-fit:contain;display:block;background:#fff;border-radius:8px}
.photo.duo img{max-width:48%}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.id{font:600 24px/1.15 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.02em;word-break:break-all}
.model{color:var(--muted);margin-top:4px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;border:1px solid currentColor;background:color-mix(in srgb,currentColor 10%,transparent)}
.status .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.st-ok{color:var(--green)}.st-bad{color:var(--red)}.st-warn{color:var(--amber)}.st-off{color:var(--muted)}
.tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
h2.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:26px 4px 12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;min-width:0}
.tile small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.tile .v{font-size:24px;font-weight:650;letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}
.tile .v i{font-style:normal;font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shop-card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.shop-photo{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--s2);display:flex;align-items:center;justify-content:center;gap:4px;color:#5d6d84;font-size:26px}
.shop-photo img{max-width:100%;max-height:100%;object-fit:contain;display:block;background:#fff}
.shop-photo.duo img{max-width:49%}
.shop-nome{font-weight:650;font-size:13.5px;line-height:1.25}
.shop-fab{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.shop-preco{font-weight:700;color:var(--orange);font-size:15px}
.shop-preco.consulta{color:var(--muted);font-weight:600;font-size:12px}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:rgba(52,211,153,.12);color:var(--green);margin-left:4px}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{background:var(--s2);border:0;color:var(--ink);width:34px;height:34px;font-size:16px;cursor:pointer}
.stepper span{font-weight:650;min-width:20px;text-align:center}
.addcart{margin-top:auto;background:var(--orange);border:0;color:#1a0d04;font-weight:700;border-radius:10px;padding:9px;font-size:13px;cursor:pointer;font-family:inherit}
.addcart:active{transform:scale(.98)}
@supports (grid-template-rows:subgrid){
  .shop-grid{row-gap:0}
  .shop-card{display:grid;grid-row:span 9;grid-template-rows:subgrid;gap:0;align-content:start;margin-bottom:10px}
  .shop-card>*{margin-top:8px;min-width:0}
  .shop-card>.r1{margin-top:0}
  .shop-card>.r1{grid-row:1}.shop-card>.r2{grid-row:2}.shop-card>.r3{grid-row:3}.shop-card>.r4{grid-row:4}.shop-card>.r5{grid-row:5}
  .shop-card>.r6{grid-row:6}.shop-card>.r7{grid-row:7}.shop-card>.r8{grid-row:8}.shop-card>.r9{grid-row:9}
  .shop-card>.addcart{margin-top:8px}
}
select.vsel{width:100%;border:1px solid var(--line);border-radius:10px;padding:7px 8px;font:inherit;font-size:12.5px;background:var(--s2);color:var(--ink)}
.cart-fab{position:fixed;right:18px;bottom:96px;z-index:6;width:54px;height:54px;border-radius:50%;background:var(--orange);border:0;color:#1a0d04;box-shadow:0 8px 20px rgba(255,122,47,.4);cursor:pointer;display:flex;align-items:center;justify-content:center}
.cart-fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cart-fab .cnt{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.overlay{position:fixed;inset:0;background:rgba(5,8,12,.65);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-top:1px solid var(--line)}
.sheet h3{margin:0 0 12px;font-size:18px}
.cart-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cart-item:last-child{border-bottom:0}
.cart-item .ph{width:48px;height:48px;border-radius:10px;background:var(--s2);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:2px}
.cart-item .ph img{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
.cart-item .nome{font-weight:650;font-size:13.5px}
.cart-item .stepper{width:96px;flex:none}
.cart-item .rm{background:none;border:0;color:var(--red);font-size:12px;cursor:pointer;padding:4px 0;font-family:inherit}
.cart-total{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding:14px 0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(10,14,19,0),rgba(10,14,19,.94) 40%);z-index:5}
.bar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1.25fr;gap:10px}
.btn{display:inline-block;width:100%;padding:15px 12px;border-radius:14px;font:650 15px inherit;font-family:inherit;border:1px solid #2b3a50;background:var(--s2);color:var(--ink);cursor:pointer}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5}
.btn.p{background:var(--orange);border-color:var(--orange);color:#1a0d04;box-shadow:0 8px 24px rgba(255,122,47,.28)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-family:inherit;font-size:16px;background:var(--s2);color:var(--ink);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,122,47,.18)}
.field textarea{min-height:76px;resize:vertical}
.field input[type=file]{border:1px dashed #2f4059;padding:10px;font-size:14px}
.field select option{background:#111821;color:#eef2f7}
.acoes{display:flex;gap:10px}
.rd{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.rd:first-of-type{border-top:0}
.rd input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--orange)}
.pt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:5px;vertical-align:middle}
.und{margin:10px 0;border:1px solid var(--line);border-radius:12px;background:var(--s1)}.und summary{cursor:pointer;padding:12px 14px;font-size:14px;list-style:none}.und summary::-webkit-details-marker{display:none}
.und .chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}.und .chips a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:5px 12px}
.und .leg{font-size:12px;color:var(--muted);padding:0 14px 12px}
.alert{padding:12px 14px;border-left:3px solid var(--orange);background:rgba(255,122,47,.09);border-radius:10px;margin:12px 0;font-size:14px}
.alert.e{border-left-color:var(--red);background:rgba(248,113,113,.1);color:#fecaca}
.alert.s{border-left-color:var(--green);background:rgba(52,211,153,.1);color:#bbf7d0}
.reg{padding:12px 0;border-top:1px solid var(--line)}.reg:first-child{border-top:0}
.reg .st{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;border:1px solid var(--line);color:var(--muted);margin-left:4px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.foot{padding:28px 0 8px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">Lumi<b>DNA</b></div><div class="badge">Registro técnico</div></div>
  <div id="msg"></div>
  <div id="content"><div class="card small">Carregando…</div></div>
  <div class="foot">Registro técnico permanente da iluminação — LumiDNA</div>
</div>
<div id="bar" class="bar hidden"><div class="in">
  <button type="button" class="btn" data-ac="problema">Reportar problema</button>
  <button type="button" class="btn p" data-ac="manutencao">Informar manutenção</button>
</div></div>
<button type="button" id="fab" class="cart-fab hidden" data-ac="carrinho" aria-label="Abrir carrinho"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.4a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6"/></svg><span id="fabCnt" class="cnt hidden">0</span></button>
<div id="ov" class="overlay hidden" data-ac="fundo"><div class="sheet" id="sheet"></div></div>

<script src="../assets/supabase-config.js"></script>
<script src="../assets/notificar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient(LUMIDNA_SUPABASE_URL,LUMIDNA_SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>(s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>String(Number(v)).replace(".",",");
const brl=v=>v==null?"sob consulta":"R$ "+Number(v).toFixed(2).replace(".",",");
const dmy=d=>{ if(!d) return "—"; const a=String(d).slice(0,10).split("-"); return a[2]+"/"+a[1]+"/"+a[0]; };
const hoje=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const NOME={led:"Barra de LED",driver:"Driver",optica:"Óptica",luminaria:"Luminária"};
const MOTIVOS=["parou de funcionar","piscando","perdeu brilho","troca preventiva","outro"];
const STATUS={novo:"Recebido",em_atendimento:"Em atendimento",entregue:"Entregue",instalado:"Instalado",resolvido:"Resolvido",cancelado:"Cancelado",aguardando_aprovacao:"Aguardando aprovação",aprovada:"Aprovada",reprovada:"Não aprovada"};
const TIT={problema:"Aviso de problema",compra:"Pedido de peças",manutencao:"Manutenção informada"};
// aviso por e-mail para a empresa (script do Google Apps Script; vazio = desligado)
function avisaEmpresa(d){
  if(!NOTIFY_URL) return;
  try{
    fetch(NOTIFY_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({chave:NOTIFY_CHAVE,serial:SERIAL,modelo:P&&P.luminaria?P.luminaria.codigo:"",local:P&&P.local?P.local:""},d))}).catch(()=>{});
  }catch(e){}
}
const GRUPO=new URLSearchParams(location.search).get("g")==="1"; let GI=null;
let SERIAL="", P=null, PED=[], CART=[], QTD={}, VAR={}, SHEET=null, FOTO=null, TERMOS=null;

function guardado(){ try{ return JSON.parse(localStorage.getItem("lumidna_contato")||"{}"); }catch(e){ return {}; } }
function guardar(n,f){ try{ localStorage.setItem("lumidna_contato",JSON.stringify({nome:n,fone:f})); }catch(e){} }
function msg(t,tipo){
  const h=t?'<div class="alert '+(tipo||"")+'">'+esc(t)+'</div>':"";
  const s=$("#smsg"); if(s&&SHEET){ s.innerHTML=h; } else { $("#msg").innerHTML=h; if(t) window.scrollTo({top:0,behavior:"smooth"}); }
}
function spec(c){
  const a=[];
  if(c.potencia_w!=null) a.push(fmt(c.potencia_w)+" W");
  if(c.cct_k) a.push(c.cct_k+" K");
  if(c.corrente_ma!=null) a.push(fmt(c.corrente_ma)+" mA");
  return a.join(" · ");
}
async function carregar(){
  const r=await sb.rpc("v2_peca_publica",{p_serial:SERIAL});
  if(r.error){ $("#content").innerHTML='<div class="card" style="color:var(--red)">Não foi possível carregar agora. Tente de novo em instantes.</div>'; return false; }
  P=r.data; if(!P){ $("#content").innerHTML='<div class="card"><b>Luminária não encontrada.</b><div class="small" style="margin-top:4px">Confira o código da etiqueta: '+esc(SERIAL)+'</div></div>'; return false; }
  const p=await sb.rpc("v2_pedidos_peca",{p_serial:SERIAL}); PED=(p.error||!p.data)?[]:p.data;
  TERMOS=termoDaPeca(P.luminaria.fabricante);
  if(GRUPO&&!GI){ try{ const g=await sb.rpc("v2_grupo_info",{p_serial:SERIAL}); if(!g.error&&g.data&&g.data.quantidade>1) GI=g.data; }catch(e){} }
  return true;
}

// ---- carrinho (guardado no aparelho, preços sempre vêm do cadastro) ----
const keyCart=()=>"lumidna2_cart_"+SERIAL;
function salvaCart(){ try{ localStorage.setItem(keyCart(),JSON.stringify(CART)); }catch(e){} }
function lerCart(){ try{ CART=JSON.parse(localStorage.getItem(keyCart())||"[]"); }catch(e){ CART=[]; } if(!Array.isArray(CART)) CART=[]; CART=CART.filter(l=>l&&resolve(l)); salvaCart(); }
// "Kit completo" = todos os itens que estão instalados nesta peça agora; o preço é a soma deles
function kitTotal(){
  const it=(P&&P.itens)||[]; if(!it.length||it.some(i=>i.preco==null)) return null;
  return it.reduce((s,i)=>s+i.preco*i.quantidade,0);
}
// "Peça completa" = luminária + todos os itens instalados (LED, driver, óptica...)
function completoTotal(){
  const l=P.luminaria; if(l.preco==null) return null;
  if(l.integrada||!((P.itens||[]).length)) return l.preco;
  const k=kitTotal(); return k==null?null:l.preco+k;
}
function completoResumo(){ const l=P.luminaria; return (l.integrada||!((P.itens||[]).length))?(l.fabricante||""):("luminária + "+kitResumo()); }
function kitResumo(){ return ((P&&P.itens)||[]).map(i=>i.quantidade+"x "+i.codigo).join(" + "); }
function resolve(l){
  const itens=P.itens||[];
  if(l.k==="kit"){ if(!P.kit||P.luminaria.integrada||P.kit_confere!==true) return null; return {nome:"Kit completo",sub:P.kit,preco:kitTotal(),max:1,fotos:itens.filter(i=>i.foto_url).map(i=>i.foto_url).slice(0,2),pl:{escopo:"kit",quantidade:1}}; }
  if(l.k==="lum") return {nome:"Peça completa",sub:P.luminaria.codigo,preco:completoTotal(),max:1,fotos:P.luminaria.foto_url?[P.luminaria.foto_url]:[],pl:{escopo:"luminaria",quantidade:1}};
  const m=/^item:(\d+):(\d+)$/.exec(String(l.k)); if(!m) return null;
  const i=itens.find(x=>x.peca_item_id===Number(m[1])); if(!i) return null;
  const sid=Number(m[2])||null, s=sid?(i.similares||[]).find(x=>x.id===sid):null; if(sid&&!s) return null;
  const c=s||i, q=Math.max(1,Math.min(Number(l.q)||1,i.quantidade));
  return {nome:NOME[i.tipo]+(s?" · similar aprovado":""),sub:c.codigo,preco:c.preco,max:i.quantidade,fotos:c.foto_url?[c.foto_url]:[],pl:{escopo:"item",peca_item_id:i.peca_item_id,similar_id:sid,quantidade:q}};
}
function addCart(k,q){
  const novo=resolve({k:k,q:q}); if(!novo) return;
  const ex=CART.find(l=>l.k===k);
  if(ex) ex.q=Math.min(novo.max,(ex.q||1)+q); else CART.push({k:k,q:Math.min(novo.max,q)});
  salvaCart(); atualizaFab();
}
function totalCart(){
  let tot=0, sem=0;
  CART.forEach(l=>{ const r=resolve(l); if(!r) return; const q=r.pl.quantidade; if(r.preco==null) sem++; else tot+=r.preco*q; });
  return {tot:tot,sem:sem};
}
function atualizaFab(){
  const n=CART.length, c=$("#fabCnt");
  c.textContent=n; c.classList.toggle("hidden",!n);
}

// ---- tela principal ----
function fotosHtml(arr,cls){ return arr.length?arr.map(u=>'<img src="'+esc(u)+'" alt="">').join(""):'<span>—</span>'; }
// foto da luminária = foto dela + fotos dos itens do kit instalado, cada uma inteira (sem esticar)
function compFotos(){
  const lum=P.luminaria.foto_url, kit=[...new Set((P.itens||[]).filter(i=>i.foto_url).map(i=>i.foto_url))].slice(0,4);
  if(!lum&&!kit.length) return '<div class="comp"><div class="main"><span class="small">Foto ainda não cadastrada</span></div></div>';
  return '<div class="comp">'+(lum?'<div class="main"><img src="'+esc(lum)+'" alt=""></div>':'')
   +(kit.length&&!lum?'<div class="kitrow solo" style="grid-template-columns:repeat('+Math.min(kit.length,2)+',1fr)">'+kit.map(u=>'<div class="kb"><img src="'+esc(u)+'" alt=""></div>').join("")+'</div>':'')+'</div>';
}
function grupoBanner(){ return (GRUPO&&GI)?'<div class="alert"><b>Etiqueta de grupo.</b> Esta luminária é uma das <b>'+GI.quantidade+'</b> iguais em <b>'+esc(GI.local||"este ambiente")+'</b>. Os dados, as peças e a garantia valem para todas. Ao pedir ou reportar, diga qual luminária é.</div>'+grupoUnidades():""; }
// unidades do grupo: recolhidas; ponto vermelho = já teve manutenção (tem histórico próprio)
function grupoUnidades(){
  const u=(GI&&GI.unidades)||[]; if(u.length<2) return "";
  const m=u.filter(x=>x.manutencao).length;
  return '<details class="und"'+(m?' open':'')+'><summary><b>Escolher uma unidade</b> <span class="small">('+u.length+')</span>'+(m?' <span class="small"><i class="pt"></i>'+m+' com manutenção</span>':'')+'</summary>'
   +'<div class="chips">'+u.map(x=>'<a href="?c='+encodeURIComponent(x.serial)+'">'+(x.manutencao?'<i class="pt"></i>':'')+esc(x.serial)+(x.retirada?' · retirada':'')+'</a>').join("")+'</div>'

// ---- manutenção informada pelo cliente (a LumiDNA aprova) ----
function reduzFoto(file){
  return new Promise((ok,err)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,1000/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      let q=.72, d=c.toDataURL("image/jpeg",q);
      while(d.length>600000&&q>.3){ q-=.1; d=c.toDataURL("image/jpeg",q); }
      URL.revokeObjectURL(u);
      if(d.length>650000) err(new Error("A foto ficou grande demais. Tente outra.")); else ok(d);
    };
    img.onerror=()=>{ URL.revokeObjectURL(u); err(new Error("Não consegui ler a foto. Use uma imagem JPG ou PNG.")); };
    img.src=u;
  });
}
function manutencao(){
  if(GRUPO&&GI){ abreSheet('<h3>Informar manutenção</h3><div class="small" style="margin-bottom:14px">Esta etiqueta é de um grupo de luminárias iguais. Para o histórico ficar certo, a manutenção é registrada pela equipe da LumiDNA: use <b>Reportar problema</b> dizendo qual luminária é.</div><div class="acoes"><button type="button" class="btn p" data-ac="problema">Reportar problema</button><button type="button" class="btn" data-ac="fechar">Fechar</button></div>',"man"); return; }
  FOTO=null; const c=guardado(), itens=P.itens||[];
  if(!itens.length){ abreSheet('<h3>Informar manutenção</h3><div class="small">Esta luminária não tem itens separados cadastrados para informar manutenção. Fale com a LumiDNA.</div><div class="acoes" style="margin-top:14px"><button type="button" class="btn" data-ac="fechar">Fechar</button></div>',"man"); return; }
  abreSheet('<h3>Informar manutenção feita</h3><div class="small" style="margin-bottom:14px">Trocou alguma parte desta luminária? Conte o que foi instalado. A LumiDNA confere e aprova para atualizar o cadastro da sua luminária; só vale depois de aprovada.</div>'
   +'<div class="field"><label>Qual item foi trocado? *</label><select id="m_item">'+itens.map(i=>'<option value="'+i.peca_item_id+'">'+esc(NOME[i.tipo])+' · '+esc(i.codigo)+(i.quantidade>1?' ('+i.quantidade+' instaladas)':'')+'</option>').join("")+'</select></div>'
   +'<div id="m_qtd"></div>'
   +'<div class="field"><label>O que foi instalado no lugar? *</label><div id="m_opc"></div></div>'
   +'<div id="m_outro" class="hidden"><div class="alert warn">Para modelos que a LumiDNA ainda não aprovou, mande o modelo e uma foto. A LumiDNA avalia e responde por aqui.</div>'
   +'<div class="field"><label>Modelo instalado *</label><input id="m_modelo"></div><div class="field"><label>Fabricante</label><input id="m_fab"></div>'
   +'<div class="field"><label>Foto do item instalado *</label><div class="acoes"><button type="button" class="btn" data-ac="camera">Tirar foto agora</button><button type="button" class="btn" data-ac="galeria">Escolher da galeria</button></div><input id="m_foto_cam" class="vh" type="file" accept="image/*" capture="environment"><input id="m_foto" class="vh" type="file" accept="image/*"><div id="m_prev" class="small" style="margin-top:8px">Nenhuma foto escolhida.</div></div></div>'
   +'<div class="field"><label>Por que foi trocado? (opcional)</label><select id="m_motivo"><option value="">—</option>'+MOTIVOS.map(m=>'<option>'+m+'</option>').join("")+'</select></div>'
   +'<div class="field"><label>Observação (opcional)</label><textarea id="m_obs"></textarea></div>'
   +'<div class="field"><label>Nome *</label><input id="m_nome" value="'+esc(c.nome||"")+'" autocomplete="name"></div><div class="field"><label>Telefone / WhatsApp *</label><input id="m_fone" value="'+esc(c.fone||"")+'" type="tel" autocomplete="tel"></div>'
   +'<div class="acoes"><button type="button" class="btn" data-ac="fechar">Cancelar</button><button type="button" class="btn p" id="enviar" data-ac="enviarManutencao">Enviar para aprovação</button></div>',"man");
  $("#m_item").onchange=opcoesMan; opcoesMan();
  ["m_foto","m_foto_cam"].forEach(id=>{ $("#"+id).onchange=e=>{ const f=e.target.files[0]; if(!f) return; FOTO=f; $("#m_prev").innerHTML='<img src="'+esc(URL.createObjectURL(f))+'" alt="" style="max-width:140px;max-height:140px;border-radius:8px;background:#fff;display:block;margin-bottom:4px"> Foto escolhida. Para trocar, escolha outra.'; }; });
}
function itemMan(){ return (P.itens||[]).find(i=>String(i.peca_item_id)===$("#m_item").value); }
function opcoesMan(){
  const i=itemMan(); if(!i) return;
  $("#m_qtd").innerHTML=i.quantidade>1?'<div class="field"><label>Quantas unidades foram trocadas?</label><select id="m_q">'+Array.from({length:i.quantidade},(_,k)=>'<option value="'+(k+1)+'" '+((k+1)===i.quantidade?"selected":"")+'>'+(k+1)+'</option>').join("")+'</select></div>':'';
  $("#m_opc").innerHTML='<label class="rd"><input type="radio" name="m_o" value="original" checked><div><b>O mesmo item</b><div class="small">'+esc(i.codigo)+'</div></div></label>'
   +(i.similares||[]).map(s=>'<label class="rd"><input type="radio" name="m_o" value="s'+s.id+'"><div><b>Similar aprovado pela LumiDNA · '+esc(s.codigo)+'</b><span class="chip">aprovado</span><div class="small">'+esc(s.fabricante||"")+(spec(s)?' · '+spec(s):'')+'</div></div></label>').join("")
   +'<label class="rd"><input type="radio" name="m_o" value="outro"><div><b>Outro modelo</b><div class="small">Precisa de modelo e foto para a LumiDNA aprovar</div></div></label>';
  document.querySelectorAll('input[name="m_o"]').forEach(r=>r.onchange=()=>{ $("#m_outro").classList.toggle("hidden",$('input[name="m_o"]:checked').value!=="outro"); });
  $("#m_outro").classList.add("hidden");
}
async function enviarManutencao(){
  const i=itemMan(), sel=$('input[name="m_o"]:checked').value, nome=$("#m_nome").value.trim(), fone=$("#m_fone").value.trim();
  if(!nome||!fone) return msg("Informe seu nome e telefone para contato.","e");
  let origem="original", similar=null, modelo=null, fab=null, foto=null;
  if(sel!=="original"&&sel!=="outro"){ origem="similar"; similar=Number(sel.slice(1)); }
  if(sel==="outro"){
    origem="outro"; modelo=$("#m_modelo").value.trim(); fab=$("#m_fab").value.trim()||null;
    if(!modelo) return msg("Informe o modelo do item instalado.","e");
    const f=FOTO; if(!f) return msg("Envie uma foto do item instalado.","e");
    $("#enviar").disabled=true; $("#enviar").textContent="Enviando…";
    try{ foto=await reduzFoto(f); }catch(e){ $("#enviar").disabled=false; $("#enviar").textContent="Enviar para aprovação"; return msg(e.message,"e"); }
  }
  $("#enviar").disabled=true;
  const r=await sb.rpc("v2_criar_manutencao",{p_serial:SERIAL,p_nome:nome,p_fone:fone,p_item:i.peca_item_id,p_qtd:$("#m_q")?Number($("#m_q").value):i.quantidade,p_origem:origem,p_similar:similar,
    p_modelo:modelo,p_fabricante:fab,p_motivo:$("#m_motivo").value||null,p_obs:$("#m_obs").value.trim()||null,p_foto:foto});
  if(r.error){ $("#enviar").disabled=false; $("#enviar").textContent="Enviar para aprovação"; return msg(r.error.message||"Não consegui enviar. Tente de novo.","e"); }
  guardar(nome,fone); const id=r.data.id;
  avisaEmpresa({tipo:"manutencao",id:id,nome:nome,fone:fone,motivo:$("#m_motivo").value,obs:$("#m_obs").value.trim(),item:$("#m_item").selectedOptions[0].text,qtd:$("#m_q")?$("#m_q").value:i.quantidade,instalado:origem==="outro"?("Outro modelo (precisa de aprovação): "+modelo+(fab?" - "+fab:"")):(origem==="similar"?"Similar aprovado pela LumiDNA":"O mesmo item")});
  await carregar(); render();
  abreSheet('<h3>Manutenção enviada · #'+id+'</h3><div>Recebemos a informação. A LumiDNA vai conferir e aprovar; você acompanha o andamento aqui nesta página, em "Seus registros".</div><div class="acoes" style="margin-top:14px"><button type="button" class="btn p" data-ac="fechar">Fechar</button></div>',"ok");
}
async function instalei(id){
  if(!confirm("Confirma que as peças deste pedido já foram instaladas?")) return;
  const r=await sb.rpc("v2_confirmar_instalado",{p_serial:SERIAL,p_pedido:id});
  if(r.error) return msg(r.error.message||"Não consegui registrar agora.","e");
  await carregar(); render(); msg("Obrigado! A instalação foi registrada no histórico da sua luminária.","s");
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-ac]"); if(!el||!P) return;
  const a=el.dataset.ac;
  if(a==="fundo"){ if(e.target===el) fechaSheet(); return; }
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT") return;
  if(a==="problema") problema(); else if(a==="manutencao") manutencao(); else if(a==="carrinho") carrinho(); else if(a==="termos") termos();
  else if(a==="camera") $("#m_foto_cam").click(); else if(a==="galeria") $("#m_foto").click();
  else if(a==="fechar") fechaSheet(); else if(a==="checkout") checkout();
  else if(a==="enviarPedido") enviarPedido(); else if(a==="enviarProblema") enviarProblema(); else if(a==="enviarManutencao") enviarManutencao();
  else if(a==="instalei") instalei(Number(el.dataset.id));
  else if(a==="add"){ const k=el.dataset.k, base=el.dataset.base; const q=base?Math.min(QTD[base]||1,((P.itens||[]).find(i=>"item:"+i.peca_item_id===base)||{quantidade:1}).quantidade):1; addCart(k,q); msg("Adicionado ao carrinho.","s"); setTimeout(()=>{ if(!SHEET) msg(""); },1800); }
  else if(a==="qtd"){ const base=el.dataset.base, i=(P.itens||[]).find(x=>"item:"+x.peca_item_id===base); QTD[base]=Math.max(1,Math.min(i.quantidade,(QTD[base]||1)+Number(el.dataset.d))); renderLoja(); }
  else if(a==="rm"){ CART.splice(Number(el.dataset.n),1); salvaCart(); atualizaFab(); carrinho(); }
  else if(a==="cq"){ const l=CART[Number(el.dataset.n)], r=resolve(l); l.q=Math.max(1,Math.min(r.max,(l.q||1)+Number(el.dataset.d))); salvaCart(); carrinho(); }
  else if(a==="pedirDoProblema"){ const it=(P.itens||[]).find(i=>i.peca_item_id===Number(el.dataset.item)); if(it){ addCart("item:"+it.peca_item_id+":0",1); } fechaSheet(); carrinho(); }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.ch==="variante"){ VAR[el.dataset.base]=Number(el.value)||0; renderLoja(); }
});
// página do ambiente (etiqueta de forro/ambiente): imagem do ambiente + grupos de luminárias iguais
async function paginaAmbiente(){
  const r=await sb.rpc("v2_local_info",{p_serial:SERIAL});
  if(r.error){ $("#content").innerHTML='<div class="card" style="color:var(--red)">Não foi possível carregar agora. Tente de novo em instantes.</div>'; return; }
  const A=r.data; if(!A){ $("#content").innerHTML='<div class="card"><b>Ambiente não encontrado.</b><div class="small" style="margin-top:4px">Confira o código da etiqueta: '+esc(SERIAL)+'</div></div>'; return; }
  const gr=A.grupos||[];
  $("#content").innerHTML='<div class="hero"><div class="small" style="text-transform:uppercase;letter-spacing:.08em">Ambiente</div><div class="id">'+esc(A.local||"SEM NOME")+'</div>'
   +'<div class="small" style="margin-top:4px"><b>'+A.total+'</b> luminária(s) em <b>'+gr.length+'</b> grupo(s)</div>'
   +(A.imagem_url?'<div style="background:#fff;border-radius:14px;padding:10px;margin-top:14px;text-align:center"><img src="'+esc(A.imagem_url)+'" alt="Desenho do ambiente" style="max-width:100%;max-height:70vh;object-fit:contain"></div>':'')+'</div>'
   +'<h2 class="sec">Luminárias deste ambiente</h2>'
   +gr.map(g=>'<a class="card" href="?c='+encodeURIComponent(g.ancora)+'&g=1" style="display:flex;gap:12px;align-items:center;margin-bottom:10px;text-decoration:none;color:inherit">'
     +(g.foto_url?'<img src="'+esc(g.foto_url)+'" alt="" style="width:64px;height:64px;object-fit:contain;background:#fff;border-radius:10px;flex:none">':'<div style="width:64px;height:64px;border-radius:10px;background:var(--s2);flex:none"></div>')
     +'<div style="flex:1;min-width:0"><b>'+esc(g.modelo)+'</b><div class="small">'+esc(g.fabricante||"")+'</div>'+(g.com_manutencao?'<div class="small"><i class="pt"></i>'+g.com_manutencao+' com manutenção</div>':'')+'</div><b style="color:var(--orange);white-space:nowrap">'+g.quantidade+'x ›</b></a>').join("");
}
async function iniciar(){
  const qs=new URLSearchParams(location.search); SERIAL=qs.get("c")||qs.get("s")||"";
  if(!SERIAL){ $("#content").innerHTML='<div class="card">Aponte o celular para a etiqueta da luminária, ou leia o QR.</div>'; return; }
  if(qs.get("l")==="1"){ await paginaAmbiente(); return; }
  if(await carregar()){ lerCart(); render(); }
}
iniciar();
