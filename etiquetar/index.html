<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e13"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex">
<title>LumiDNA — etiquetar</title>
<style>
:root{color-scheme:dark;--bg:#0a0e13;--s1:#111821;--s2:#172130;--ink:#eef2f7;--muted:#8896a8;--line:#1f2b3b;--orange:#ff7a2f;--green:#34d399;--red:#f87171;--amber:#f5b942}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Inter,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(900px 380px at 50% -120px,rgba(255,122,47,.16),transparent 70%);background-repeat:no-repeat}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 4px}
.logo{font-weight:800;letter-spacing:-.03em;font-size:20px}.logo b{color:var(--orange)}
.badge{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.small{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:-.02em}
.bar{height:10px;background:var(--s2);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:var(--s1);color:var(--ink);font:600 15px inherit;font-family:inherit;cursor:pointer;text-align:center}
.tab.on{background:var(--orange);border-color:var(--orange);color:#1a0d04}
.btn{display:block;width:100%;padding:16px 12px;border-radius:14px;font:650 17px inherit;font-family:inherit;border:1px solid #2b3a50;background:var(--s2);color:var(--ink);cursor:pointer;text-align:center}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--orange);border-color:var(--orange);color:#1a0d04;box-shadow:0 8px 24px rgba(255,122,47,.28)}
.btn.s{padding:10px 14px;font-size:14px;width:auto;display:inline-block}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-family:inherit;font-size:16px;background:var(--s2);color:var(--ink);width:100%}
.row2{display:flex;gap:8px}.row2>*{flex:1}.row2>button{flex:none;width:auto}
.alert{padding:12px 14px;border-left:3px solid var(--orange);background:rgba(255,122,47,.09);border-radius:10px;margin:0 0 12px;font-size:14px}
.alert.e{border-left-color:var(--red);background:rgba(248,113,113,.1);color:#fecaca}
.alert.s{border-left-color:var(--green);background:rgba(52,211,153,.1);color:#bbf7d0}
.grp{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--s1);overflow:hidden}
.gh{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--s2)}
.gh img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;flex:none}
.gh .t{flex:1;min-width:0}.gh b{font-size:16px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid var(--line)}
.pill.ok{color:var(--green);border-color:var(--green)}.pill.pe{color:var(--amber);border-color:var(--amber)}
.pc{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.pc .s{flex:1;min-width:0}.pc .s b{font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.fix{padding:10px 16px;border-radius:12px;border:0;background:var(--green);color:#06130c;font:700 15px inherit;font-family:inherit;cursor:pointer}
.und{background:none;border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:10px;font:13px inherit;font-family:inherit;cursor:pointer}
.ok-t{color:var(--green);font-size:13px}
#scan{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
#scan video{flex:1;width:100%;object-fit:cover;min-height:0}
#scan .mira{position:absolute;left:50%;top:38%;width:62vmin;height:62vmin;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.85);border-radius:20px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
#scan .res{position:absolute;left:12px;right:12px;bottom:92px;padding:14px;border-radius:14px;font-size:16px;font-weight:600;text-align:center;background:var(--s1);color:var(--ink);border:1px solid var(--line)}
#scan .res.ok{background:#0f3d2a;border-color:var(--green)}#scan .res.er{background:#4a1616;border-color:var(--red)}#scan .res.ja{background:#4a3a10;border-color:var(--amber)}
#scan .fecha{position:absolute;left:12px;right:12px;bottom:16px}
.etqs{display:flex;flex-wrap:wrap;gap:8px}
.etq{display:flex;gap:2mm;align-items:center;border:1px dashed #b4b2a9;padding:2mm;overflow:hidden;font-size:9pt;line-height:1.25;background:#fff;color:#000;break-inside:avoid}
.etq .qr svg{width:100%;height:100%;display:block}.etq .qr{flex:none}.etq .et{min-width:0;overflow-wrap:anywhere}.etq .et b{font-size:11pt}
@media print{:root{--bg:#fff}body{background:#fff;padding:0}.wrap{max-width:none;padding:0}.noprint{display:none!important}.etq{border:0;outline:0.1mm dashed #bbb}.etqs{gap:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top noprint"><div class="logo">Lumi<b>DNA</b></div><div class="badge">Etiquetar</div></div>
  <div id="msg" class="noprint"></div>
  <div id="content"><div class="card small">Carregando…</div></div>
</div>
<div id="scan" class="hidden">
  <video id="vid" playsinline muted></video><div class="mira"></div>
  <div class="res" id="res">Aponte para o QR da etiqueta</div>
  <button type="button" class="btn fecha" id="fechaScan">Fechar câmera</button>
</div>
<script src="../assets/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const sb=supabase.createClient(LUMIDNA_SUPABASE_URL,LUMIDNA_SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>(s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dh=d=>{ if(!d) return ""; const x=new Date(d); return x.toLocaleDateString("pt-BR")+" "+x.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); };
const LINK=(new URLSearchParams(location.search).get("t")||"").trim();
const urlPeca=s=>LUMIDNA_SITE_BASE+"/ativo/?c="+encodeURIComponent(s);
const urlGrupo=s=>LUMIDNA_SITE_BASE+"/ativo/?c="+encodeURIComponent(s)+"&g=1";
const ambDe=l=>{ const p=String(l||"").split(">").map(s=>s.trim()).filter(Boolean); return p.length?p[p.length-1]:"(sem ambiente)"; };
function gruposFiltrados(){ const m=new Map(); filtradas().forEach(p=>{ const k=[p.local||"",p.modelo,p.kit||0].join("|"); if(!m.has(k)) m.set(k,{local:p.local||"",modelo:p.modelo,foto:p.foto_url,ps:[]}); m.get(k).ps.push(p); }); const a=[...m.values()]; a.forEach(g=>g.ps.sort((x,y)=>(x.numero||0)-(y.numero||0)||x.serial.localeCompare(y.serial))); return a; }
let GR=[], MODO="ind"; let D=null, ABA="etiquetar", AMB="", SO_PEND=true, NOME="", ETQ={w:60,h:30}, STREAM=null, LOOP=null, ULT={c:"",t:0}, BUSY=false;
try{ NOME=localStorage.getItem("lumidna_etiquetador")||""; }catch(e){}

function msg(t,tipo){ $("#msg").innerHTML=t?'<div class="alert '+(tipo||"")+'">'+esc(t)+'</div>':""; if(t) window.scrollTo({top:0,behavior:"smooth"}); }
async function carregar(){
  if(!/^[0-9a-f-]{36}$/i.test(LINK)){ $("#content").innerHTML='<div class="card"><b>Link incompleto.</b><div class="small" style="margin-top:4px">Abra a tela de etiquetar pelo link que a LumiDNA enviou.</div></div>'; return false; }
  const r=await sb.rpc("v2_etiq_obra",{p_link:LINK});
  if(r.error){ $("#content").innerHTML='<div class="card"><b>Não foi possível abrir.</b><div class="small" style="margin-top:4px">'+esc(r.error.message)+'</div></div>'; return false; }
  D=r.data; return true;
}
const feitas=()=>D.pecas.filter(p=>p.etiquetada_em).length;
function ambientes(){ const m=new Map(); D.pecas.forEach(p=>{ const k=p.local||"(sem ambiente)"; const a=m.get(k)||{k:k,t:0,f:0}; a.t++; if(p.etiquetada_em) a.f++; m.set(k,a); }); return [...m.values()]; }
const filtradas=()=>D.pecas.filter(p=>!AMB||(p.local||"(sem ambiente)")===AMB);

function render(){
  if(!NOME){ $("#content").innerHTML='<div class="card"><h1>Quem está etiquetando?</h1><div class="small" style="margin-bottom:12px">O seu nome fica registrado em cada etiqueta fixada.</div><div class="field"><input id="nm" placeholder="Seu nome" autocomplete="name" maxlength="60"></div><button type="button" class="btn p" data-ac="nome">Continuar</button></div>'; return; }
  const f=feitas(), t=D.pecas.length, pc=t?Math.round(f*100/t):0;
  let h='<div class="card noprint"><h1>'+esc(D.obra)+'</h1><div class="small">'+esc(D.link_nome)+' · link válido até '+new Date(D.valido_ate).toLocaleDateString("pt-BR")+'</div>'
   +'<div class="bar"><i style="width:'+pc+'%"></i></div><b>'+f+' de '+t+'</b> <span class="small">etiquetas fixadas</span>'+(f===t&&t?' <span class="ok-t">· obra completa ✓</span>':'')+'</div>'
   +'<div class="tabs noprint"><button type="button" class="tab '+(ABA==="etiquetar"?"on":"")+'" data-ac="aba" data-a="etiquetar">Etiquetar</button><button type="button" class="tab '+(ABA==="grupos"?"on":"")+'" data-ac="aba" data-a="grupos">Por grupo</button><button type="button" class="tab '+(ABA==="imprimir"?"on":"")+'" data-ac="aba" data-a="imprimir">Imprimir</button></div>';
  const am=ambientes();
  const selAmb='<div class="field noprint"><label>Ambiente</label><select id="amb"><option value="">Todos ('+t+')</option>'+am.map(a=>'<option value="'+esc(a.k)+'" '+(AMB===a.k?"selected":"")+'>'+esc(a.k)+' — '+(a.t-a.f)+' pendente(s) de '+a.t+'</option>').join("")+'</select></div>';
  if(ABA==="etiquetar") h+=telaEtiquetar(selAmb); else if(ABA==="grupos") h+=telaGrupos(selAmb); else h+=telaImprimir(selAmb);
  $("#content").innerHTML=h;
  if($("#amb")) $("#amb").onchange=e=>{ AMB=e.target.value; render(); };
  if($("#sopend")) $("#sopend").onchange=e=>{ SO_PEND=e.target.checked; render(); };
  if($("#modo")) $("#modo").onchange=e=>{ MODO=e.target.value; render(); };
  if($("#e_w")) { $("#e_w").oninput=ajusta; $("#e_h").oninput=ajusta; }
}
function telaEtiquetar(selAmb){
  const lista=filtradas().filter(p=>!SO_PEND||!p.etiquetada_em), por=new Map();
  lista.forEach(p=>{ const a=por.get(p.modelo)||{m:p.modelo,foto:p.foto_url,fab:p.fabricante,l:[]}; a.l.push(p); por.set(p.modelo,a); });
  const tot=filtradas();
  let h='<button type="button" class="btn p noprint" data-ac="scan" style="margin-bottom:12px">Escanear etiqueta</button>'
   +'<div class="card noprint"><div class="field" style="margin:0"><label>Ou digite a série (ou os últimos números)</label><div class="row2"><input id="manual" placeholder="Ex.: CRJ-002-071 ou 071" autocapitalize="characters" autocomplete="off"><button type="button" class="btn s p" data-ac="manual">Fixar</button></div></div></div>'
   +selAmb+'<label class="small noprint" style="display:flex;gap:8px;align-items:center;margin:0 0 12px"><input type="checkbox" id="sopend" '+(SO_PEND?"checked":"")+' style="width:20px;height:20px;accent-color:var(--orange)"> Mostrar só as pendentes</label>';
  if(!lista.length) h+='<div class="card noprint">'+(tot.length?'<b>Tudo fixado aqui ✓</b><div class="small" style="margin-top:4px">Não há etiquetas pendentes neste ambiente.</div>':'<div class="small">Nenhuma luminária neste ambiente.</div>')+'</div>';
  por.forEach(g=>{
    const pend=tot.filter(p=>p.modelo===g.m&&!p.etiquetada_em).length, tt=tot.filter(p=>p.modelo===g.m).length;
    h+='<div class="grp noprint"><div class="gh">'+(g.foto?'<img src="'+esc(g.foto)+'" alt="">':'')+'<div class="t"><b>'+esc(g.m)+'</b><div class="small">'+esc(g.fab||"")+'</div></div><span class="pill '+(pend?"pe":"ok")+'">'+(pend?pend+" pendente(s)":"completo")+' · '+tt+'</span></div>'
     +g.l.map(p=>'<div class="pc"><div class="s"><b>'+esc(p.serial)+'</b><div class="small">'+esc(p.local||"sem ambiente")+(p.etiquetada_em?' · <span class="ok-t">fixada '+dh(p.etiquetada_em)+(p.etiquetada_por?' por '+esc(p.etiquetada_por):'')+'</span>':'')+'</div></div>'
       +(p.etiquetada_em?'<button type="button" class="und" data-ac="desfazer" data-s="'+esc(p.serial)+'">Desfazer</button>':'<button type="button" class="fix" data-ac="fixar" data-s="'+esc(p.serial)+'">Fixar</button>')+'</div>').join("")+'</div>';
  });
  return h;
}
function telaGrupos(selAmb){
  GR=gruposFiltrados(); let h=selAmb+'<div class="small noprint" style="margin-bottom:10px">Luminárias iguais no mesmo ambiente formam um grupo e usam a mesma etiqueta. Toque em <b>+1 fixada</b> a cada etiqueta colada.</div>';
  if(!GR.length) return h+'<div class="card noprint">Nenhuma luminária neste ambiente.</div>';
  GR.forEach((g,i)=>{ const f=g.ps.filter(p=>p.etiquetada_em).length, n=g.ps.length, pc=Math.round(f*100/n);
    h+='<div class="grp noprint"><div class="gh">'+(g.foto?'<img src="'+esc(g.foto)+'" alt="">':'')+'<div class="t"><b>'+esc(g.modelo)+'</b><div class="small">'+esc(ambDe(g.local))+'</div></div><span class="pill '+(f===n?"ok":"pe")+'">'+f+' de '+n+'</span></div>'
     +'<div style="padding:10px 12px"><div class="bar" style="margin:0 0 10px"><i style="width:'+pc+'%"></i></div><div class="row2"><button type="button" class="fix" data-ac="gmais" data-i="'+i+'" '+(f===n?'disabled style="opacity:.5"':'')+'>+1 fixada</button><button type="button" class="und" data-ac="gmenos" data-i="'+i+'" '+(f===0?'disabled':'')+'>−1</button></div></div></div>'; });
  return h;
}
function telaImprimir(selAmb){
  if(MODO==="grupo") return telaImprimirGrupo(selAmb);
  const w=ETQ.w, h2=ETQ.h; let lista=filtradas().filter(p=>!SO_PEND||!p.etiquetada_em);
  const etq=lista.map(p=>{ let qr=""; try{ const q=qrcode(0,"M"); q.addData(urlPeca(p.serial)); q.make(); qr=q.createSvgTag({cellSize:4,margin:0,scalable:true}); }catch(e){}
    return '<div class="etq" style="width:'+w+'mm;height:'+h2+'mm"><div class="qr" style="width:'+(h2-4)+'mm;height:'+(h2-4)+'mm">'+qr+'</div><div class="et"><b>'+esc(p.serial)+'</b><br>'+esc(p.modelo)+'<br>'+esc(p.local||"")+'<br><span>'+esc(D.obra)+'</span></div></div>'; }).join("");
  return selAmb+seletorModo()+'<div class="card noprint"><label class="small" style="display:flex;gap:8px;align-items:center;margin:0 0 12px"><input type="checkbox" id="sopend" '+(SO_PEND?"checked":"")+' style="width:20px;height:20px;accent-color:var(--orange)"> Imprimir só as pendentes</label>'
   +'<div class="small" style="margin-bottom:8px">Ajuste o tamanho para o da sua etiqueta. Cada uma leva o QR, a série, o modelo e o ambiente. Serão impressas <b>'+lista.length+'</b> etiqueta(s).</div>'
   +'<div class="row2"><div class="field" style="margin:0"><label>Largura (mm)</label><input id="e_w" type="number" min="20" max="200" value="'+w+'"></div><div class="field" style="margin:0"><label>Altura (mm)</label><input id="e_h" type="number" min="15" max="100" value="'+h2+'"></div></div>'
   +'<button type="button" class="btn p" data-ac="imprimir" style="margin-top:12px">Imprimir</button></div><div class="etqs">'+etq+'</div>';
}
function seletorModo(){ return '<div class="field noprint"><label>Tipo de etiqueta</label><select id="modo"><option value="ind" '+(MODO==="ind"?"selected":"")+'>Individual: série de cada luminária</option><option value="grupo" '+(MODO==="grupo"?"selected":"")+'>Do grupo: igual para as luminárias iguais do ambiente</option></select></div>'; }
function telaImprimirGrupo(selAmb){
  const w=ETQ.w, h2=ETQ.h, gs=gruposFiltrados(); let total=0, etq="";
  gs.forEach(g=>{ const n=SO_PEND?g.ps.filter(p=>!p.etiquetada_em).length:g.ps.length; if(!n) return; total+=n; let qr=""; try{ const q=qrcode(0,"M"); q.addData(urlGrupo(g.ps[0].serial)); q.make(); qr=q.createSvgTag({cellSize:4,margin:0,scalable:true}); }catch(e){}
    const un='<div class="etq" style="width:'+w+'mm;height:'+h2+'mm"><div class="qr" style="width:'+(h2-4)+'mm;height:'+(h2-4)+'mm">'+qr+'</div><div class="et"><b>'+esc(ambDe(g.local))+'</b><br>'+esc(g.modelo)+'<br>Grupo de '+g.ps.length+'<br><span>'+esc(g.ps[0].serial)+'</span></div></div>'; etq+=Array.from({length:n},()=>un).join(""); });
  return selAmb+seletorModo()+'<div class="card noprint"><label class="small" style="display:flex;gap:8px;align-items:center;margin:0 0 12px"><input type="checkbox" id="sopend" '+(SO_PEND?"checked":"")+' style="width:20px;height:20px;accent-color:var(--orange)"> Imprimir só as que faltam fixar</label>'
   +'<div class="small" style="margin-bottom:8px">Cada grupo usa uma etiqueta igual para todas as suas luminárias. Serão impressas <b>'+total+'</b> etiqueta(s).</div>'
   +'<div class="row2"><div class="field" style="margin:0"><label>Largura (mm)</label><input id="e_w" type="number" min="20" max="200" value="'+w+'"></div><div class="field" style="margin:0"><label>Altura (mm)</label><input id="e_h" type="number" min="15" max="100" value="'+h2+'"></div></div>'
   +'<button type="button" class="btn p" data-ac="imprimir" style="margin-top:12px">Imprimir</button></div><div class="etqs">'+etq+'</div>';
}
function ajusta(){ const w2=Math.max(20,parseInt($("#e_w").value)||60), h2=Math.max(15,parseInt($("#e_h").value)||30); ETQ={w:w2,h:h2}; document.querySelectorAll(".etq").forEach(e=>{e.style.width=w2+"mm";e.style.height=h2+"mm"}); document.querySelectorAll(".etq .qr").forEach(e=>{e.style.width=(h2-4)+"mm";e.style.height=(h2-4)+"mm"}); }

// ---------- marcar ----------
async function marcar(serial,desfazer){
  const r=await sb.rpc("v2_etiq_marcar",{p_link:LINK,p_serial:serial,p_por:NOME,p_desfazer:!!desfazer});
  if(r.error) return {erro:r.error.message};
  const x=r.data, p=D.pecas.find(q=>q.serial===x.serial);
  if(p){ p.etiquetada_em=x.etiquetada_em; p.etiquetada_por=x.etiquetada_por; }
  return x;
}
function acharSerial(txt){
  const t=String(txt||"").trim().toUpperCase(); if(!t) return null;
  const exato=D.pecas.find(p=>p.serial.toUpperCase()===t); if(exato) return exato.serial;
  const fim=D.pecas.filter(p=>p.serial.toUpperCase().endsWith("-"+t.replace(/^0+(?=\d)/,"").padStart(3,"0"))||p.serial.toUpperCase().endsWith(t));
  return fim.length===1?fim[0].serial:(fim.length>1?"?":null);
}

// ---------- câmera ----------
function serialDoQR(dado){
  const s=String(dado||"").trim(); let c=null;
  try{ const u=new URL(s); c=u.searchParams.get("c")||u.searchParams.get("s"); }catch(e){}
  if(!c) c=s;
  return /^[A-Za-z0-9]{2,6}-\d{2,4}-\d{2,5}$/.test(c)?c:null;
}
function aviso(t,cls){ const r=$("#res"); r.className="res "+(cls||""); r.textContent=t; }
async function abreScanner(){
  $("#scan").classList.remove("hidden"); document.body.style.overflow="hidden"; aviso("Aponte para o QR da etiqueta","");
  try{
    STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    const v=$("#vid"); v.srcObject=STREAM; await v.play();
    const cv=document.createElement("canvas"), cx=cv.getContext("2d",{willReadFrequently:true});
    LOOP=setInterval(async()=>{
      if(BUSY||!v.videoWidth) return;
      const k=Math.min(1,640/v.videoWidth); cv.width=Math.round(v.videoWidth*k); cv.height=Math.round(v.videoHeight*k);
      cx.drawImage(v,0,0,cv.width,cv.height); const im=cx.getImageData(0,0,cv.width,cv.height);
      const q=jsQR(im.data,cv.width,cv.height,{inversionAttempts:"dontInvert"}); if(!q) return;
      const ser=serialDoQR(q.data); const agora=Date.now();
      if(ser&&ser===ULT.c&&agora-ULT.t<3500) return; if(!ser&&q.data===ULT.c&&agora-ULT.t<3500) return;
      ULT={c:ser||q.data,t:agora};
      if(!ser){ aviso("Este QR não é de uma etiqueta LumiDNA","er"); return; }
      BUSY=true; const x=await marcar(ser,false); BUSY=false;
      if(x.erro){ aviso(ser+" — "+x.erro,"er"); if(navigator.vibrate) navigator.vibrate([120,80,120]); return; }
      aviso(x.ja_estava?(x.serial+" · "+x.modelo+" — já estava fixada"):("✓ "+x.serial+" · "+x.modelo+(x.local?" · "+x.local:"")+" fixada ("+x.feitas+"/"+x.total+")"),x.ja_estava?"ja":"ok");
      if(navigator.vibrate) navigator.vibrate(x.ja_estava?[60,60,60]:60);
    },180);
  }catch(e){ aviso("Não consegui abrir a câmera. Libere a permissão no navegador ou use a opção de digitar a série.","er"); }
}
function fechaScanner(){ clearInterval(LOOP); LOOP=null; if(STREAM){ STREAM.getTracks().forEach(t=>t.stop()); STREAM=null; } $("#scan").classList.add("hidden"); document.body.style.overflow=""; render(); }

document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-ac]"); if(!el||!D&&el.dataset.ac!=="nome") return; const a=el.dataset.ac;
  if(a==="nome"){ const v=($("#nm").value||"").trim(); if(v.length<2) return msg("Escreva seu nome.","e"); NOME=v; try{ localStorage.setItem("lumidna_etiquetador",v); }catch(x){} msg(""); render(); }
  else if(a==="aba"){ ABA=el.dataset.a; render(); }
  else if(a==="scan"){ abreScanner(); }
  else if(a==="fixar"||a==="desfazer"){ el.disabled=true; const x=await marcar(el.dataset.s,a==="desfazer"); if(x.erro){ el.disabled=false; return msg(x.erro,"e"); } msg(""); const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(a==="manual"){ const s=acharSerial($("#manual").value); if(!s) return msg("Não achei essa série nesta obra.","e"); if(s==="?") return msg("Mais de uma série termina assim. Digite a série completa.","e"); const x=await marcar(s,false); if(x.erro) return msg(x.erro,"e"); msg(x.ja_estava?(x.serial+" já estava fixada."):("✓ "+x.serial+" · "+x.modelo+" fixada."),x.ja_estava?"":"s"); render(); }
  else if(a==="imprimir"){ window.print(); }
  else if(a==="gmais"||a==="gmenos"){ const g=GR[Number(el.dataset.i)]; if(!g) return; const alvo=a==="gmais"?g.ps.find(p=>!p.etiquetada_em):[...g.ps].filter(p=>p.etiquetada_em).sort((x,y)=>new Date(y.etiquetada_em)-new Date(x.etiquetada_em))[0]; if(!alvo) return; el.disabled=true; const x=await marcar(alvo.serial,a==="gmenos"); if(x.erro){ el.disabled=false; return msg(x.erro,"e"); } msg(""); const y=window.scrollY; render(); window.scrollTo(0,y); }
});
$("#fechaScan").onclick=fechaScanner;
(async()=>{ if(await carregar()) render(); })();
