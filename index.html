<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LumiDNA LD-000001</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:24px;color:#1f252b}
    .card{max-width:680px;margin:30px auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .logo{font-size:30px;font-weight:800;margin-bottom:20px}.logo span{color:#ff6a1a}
    .badge{display:inline-block;background:#e9f7ee;color:#247a45;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
    h1{font-size:24px;margin:18px 0 8px}
    .grid{display:grid;grid-template-columns:160px 1fr;gap:10px 16px;margin-top:20px}
    .k{color:#6b747d}
    .note{margin-top:24px;background:#fff6ef;border-left:4px solid #ff6a1a;padding:12px;border-radius:8px}
    @media(max-width:600px){.grid{grid-template-columns:1fr}.k{font-weight:700;margin-top:6px}}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Lumi<span>DNA</span></div>
    <span class="badge">PROTÓTIPO ATIVO</span>
    <h1>LD-000001</h1>
    <div>Primeiro ativo de teste do LumiDNA</div>
    <div class="grid">
      <div class="k">Modelo</div><div>Luminária de teste</div>
      <div class="k">Fabricante</div><div>LDARTI</div>
      <div class="k">Status</div><div>Em prototipagem</div>
      <div class="k">Identidade</div><div>LD-000001</div>
      <div class="k">Acesso</div><div>NFC / QR / URL</div>
    </div>
    <div class="note"><b>Teste LumiDNA:</b> esta página valida o fluxo TAG → URL → ativo digital.</div>
  </div>
</body>
</html>
